<script>
/*
SILENT / 6.00 SECONDS
0.00–0.55  Opening already in motion: the enormous upright ring retreats,
           uncovering “One concept.” Its silhouette becomes the visual anchor.
0.55–1.35  Anticipation: the ring slows above the production field.
1.35–2.25  Acceleration: it moves down and back; its travel reveals
           “Every version.” A format boundary grows around the same idea.
2.25–3.10  The boundary stretches from square to portrait.
3.10–3.85  The boundary expands to landscape; prior proportions remain
           as fine registration outlines. The ring retains its geometry.
3.85–4.65  All three formats settle around the one unchanged brand object.
           “Included.” and the offer/CTA are revealed.
4.65–6.00  Complete, motionless brand and CTA hold.
All state derives exclusively from the host's time parameter.
*/
(function(){
const $=id=>document.getElementById(id);
const clamp=x=>Math.max(0,Math.min(1,x));
const p=(t,a,b)=>clamp((t-a)/(b-a));
const out=x=>1-Math.pow(1-x,4);
const smooth=x=>x*x*(3-2*x);
const mix=(a,b,x)=>a+(b-a)*x;
const ring=$('ring'),stage=$('stage');
function rect(el,w,h,opacity){
el.setAttribute('x',508-w/2);
el.setAttribute('y',178-h/2);
el.setAttribute('width',w);
el.setAttribute('height',h);
el.setAttribute('rx',18);
el.style.opacity=opacity;
}
function reveal(id,q,px){
$(id).style.transform='translateY('+((1-q)*px)+'px)';
}
window.renderFrame=function(time){
const t=Math.max(0,Math.min(6,Number(time)||0));
const entry=out(p(t,-.12,.8));
const travel=smooth(p(t,1.15,2.25));
const settle=out(p(t,3.85,4.65));
const width=mix(mix(1050,840,entry),470,travel);
const centerY=mix(mix(510,490,entry),624,travel);
ring.style.transform='translate('+(540-width/2)+'px,'+(centerY-width*(516/1408)/2)+'px) scale('+(width/1408)+')';

const field=out(p(t,.8,2.1));
stage.style.transform='translateY('+((1-field)*135)+'px)';
stage.style.clipPath='inset(0 '+((1-field)*36)+'% 0 '+((1-field)*36)+'% round 32px)';
reveal('lineOne',out(p(t,.05,.72)),115);
reveal('lineTwo',out(p(t,1.48,2.25)),115);
$('included').firstElementChild.style.transform='translateY('+((1-settle)*48)+'px)';

const form=out(p(t,1.8,2.3));
const tall=smooth(p(t,2.3,3.1));
const landscape=smooth(p(t,3.1,3.85));
const w=mix(mix(280,176,tall),656,landscape);
const h=mix(mix(250,306,tall),222,landscape);
rect($('wide'),w*form,h*form,.78*form);
rect($('square'),280,250,.32*tall);
rect($('portrait'),176,306,.48*landscape);

$('formatLabels').style.opacity=settle;
$('formatLabels').style.transform='translateY('+((1-settle)*10)+'px)';
$('leftRule').style.strokeDasharray='66';
$('rightRule').style.strokeDasharray='66';
$('leftRule').style.strokeDashoffset=66*(1-settle);
$('rightRule').style.strokeDashoffset=66*(1-settle);
$('leftRule').style.opacity=.6*settle;
$('rightRule').style.opacity=.6*settle;

const close=out(p(t,4.05,4.65));
$('footer').style.clipPath='inset('+((1-close)*100)+'% 0 0 0)';
$('footer').style.transform='translateY('+((1-close)*18)+'px)';
$('baseline').style.transformOrigin='left';
$('baseline').style.transform='scaleX('+close+')';
};
window.renderFrame(0);
})();
</script>
<script>document.fonts.ready.then(()=>{(function playShortFilm(draw, requestFrame = requestAnimationFrame) {
  let start;
  function frame(now) {
    start ??= now;
    const t = Math.min(6, (now - start) / 1000);
    draw(t);
    if (t < 6) requestFrame(frame);
  }
  requestFrame(frame);
})(window.renderFrame)})</script></body>
