    Lay = {typeW: Math.round(W*0.42 - mx), hlMax: 100*u, k: 1.4*u, ox: Math.round(W*0.458), oy: 200*u, bleedBottom:true};
  } else if (orient === 'portrait' && ar > 1.5) {
    Lay = {typeW: Math.round(W - mx - mr), hlMax: 104*u, k: 1.5*u, ox: mx, oy: Math.round(H*0.396), bleedBottom:false};
  } else if (orient === 'portrait') {
    Lay = {typeW: Math.round(W - mx - mr), hlMax: 100*u, k: 1*u, ox: 390*u, oy: Math.round(H - 750*u), bleedBottom:true};
  } else {
    Lay = {typeW: Math.round(W - mx - mr), hlMax: 100*u, k: 1*u, ox: 390*u, oy: 470*u, bleedBottom:true};
  }
  var k = Lay.k;
  var H0 = Math.max(640, Math.ceil((H - Lay.oy)/k) + 24);      /* top-down sheet always bleeds bottom */
  var edgeH = Lay.bleedBottom ? Math.max(900, Math.ceil((H - Lay.oy)/k)) : Math.max(160, Math.round(((H - 340*u) - (Lay.oy + 302*k))/k));
  var RECT = 'polygon(0px 0px, 830px 0px, 830px '+H0+'px, 0px '+H0+'px)';
  var FACE = 'polygon(40px 0px, 790px 0px, 830px 82px, 0px 82px)';

  hero.style.left = Lay.ox + 'px';
  hero.style.top = Lay.oy + 'px';
  hero.style.transform = 'scale(' + k + ')';
  edge.style.height = edgeH + 'px';
  if (!Lay.bleedBottom) { ground.style.display = 'block'; ground.style.top = (302 + edgeH - 8) + 'px'; }

  [wm, lk].forEach(function(el){ el.style.insetInlineStart = mx + 'px'; el.style.top = logoTop + 'px'; });
  wm.style.height = (32*u) + 'px';
  lk.style.height = (32*u*276/243) + 'px';

  type.style.insetInlineStart = mx + 'px';
  type.style.top = typeTop + 'px';
  type.style.width = Lay.typeW + 'px';

  /* ---------- FAN (s2) ---------- */
  var fanSpecs = [
    {r:-15, lb:'9:16 · RU', w:117, h:208},
    {r:-5,  lb:'4:5 · EN',  w:166, h:208},
    {r:5,   lb:'1:1 · ES',  w:174, h:174},
    {r:15,  lb:'16:9 · RU', w:174, h:98}
  ];
  var fanEls = [], tickEls = [];
  fanSpecs.forEach(function(s){
    var d = document.createElement('div');
    d.className = 'fs';
    d.innerHTML =
      '<div class="pf" style="width:'+s.w+'px;height:'+s.h+'px">' +
        '<i style="top:10px;width:52%;height:10px"></i>' +
        '<i style="top:25px;width:34%;height:10px;background:#8FA3B1"></i>' +
        '<i style="top:'+(s.h-22)+'px;width:36%;height:12px;border-radius:6px"></i>' +
      '</div>' +
      '<div class="bd"></div>' +
      '<svg width="26" height="24" viewBox="0 0 26 24" aria-hidden="true"><path d="M3 13.5c2.2 1.6 4 3.6 5.6 6.2C11.6 12.4 16 6.6 23 2.6" fill="none" stroke="#5A6B78" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="36" stroke-dashoffset="36"/></svg>' +
      '<div class="lb">' + s.lb + '</div>';
    fan.appendChild(d);
    fanEls.push(d);
    tickEls.push(d.querySelector('path'));
  });

  /* ---------- RIFFLE (s1, discrete stop-motion, pure function of t) ---------- */
  var frame = $('frame'), folio = $('folio'), slug = $('slug');
  var fB1 = frame.querySelector('.b1'), fB2 = frame.querySelector('.b2'), fPl = frame.querySelector('.pl');
  var FMTS = [{id:'9:16',w:272,h:484},{id:'1:1',w:484,h:484},{id:'16:9',w:554,h:312},{id:'4:5',w:387,h:484}];
  var LANGS = ['RU','EN','ES'];
  var BARS = {RU:[.64,.46], EN:[.52,.36], ES:[.72,.5]};
  var curLang = (LANGS.indexOf(lang.toUpperCase()) > -1) ? lang.toUpperCase() : 'RU';
  var s1Win = null;
  cut.scenes.forEach(function(s){ if (s.id === 's1') s1Win = s; });
  var riffleDur = s1Win ? Math.max(0.8, Math.min(2.2, 1.4 + ((s1Win.end - s1Win.start) - 3) * (0.8/0.6))) : 0;
  var riffleN = Math.max(2, Math.round(riffleDur * 12));
  var lastKey = '';
  function drawSheet(num, f, lg){
    var key = num + f.id + lg;
    if (key === lastKey) return; lastKey = key;
    folio.textContent = String(num).padStart(3, '0');
    slug.textContent = 'KITE · ' + f.id + ' · ' + lg + ' · 170gsm';
    frame.style.width = f.w + 'px'; frame.style.height = f.h + 'px';
    var bw = BARS[lg] || BARS.RU, inner = f.w - 48;
    fB1.style.top = '64px'; fB1.style.width = Math.round(inner*bw[0]) + 'px';
    fB2.style.top = '96px'; fB2.style.width = Math.round(inner*bw[1]) + 'px';
    fPl.style.top = (f.h - 54) + 'px'; fPl.style.width = Math.round(Math.min(150, inner*.42)) + 'px';
  }
  function renderRiffle(t){
    if (!s1Win) return;
    var p = t - s1Win.start;
    if (p >= riffleDur || p < 0 && t > 0) { drawSheet(400, FMTS[3], curLang); return; }
    var i = Math.max(0, Math.min(riffleN - 1, Math.floor(p * 12)));
    if (i >= riffleN - 1) { drawSheet(400, FMTS[3], curLang); return; }
    var q = i / (riffleN - 1);
    var num = Math.max(1, Math.round(1 + 399 * (1 - Math.pow(1 - q, 2))));
    drawSheet(num, FMTS[i % 4], LANGS[i % 3]);
  }

  /* ---------- COPY ---------- */
  function has(key){ return typeof copy[key] === 'string' && copy[key].trim().length > 0; }
  function tidy(t){
    var re = /(^|[\s\u00A0])([\p{L}\p{N}]{1,2})\s+/gu;
    return t.trim().replace(re, '$1$2\u00A0').replace(re, '$1$2\u00A0').replace(/№\s+/g, '№\u00A0');
  }
  function sentences(t){ return t.split(/(?<=[.!?…])\s+(?=\S)/); }
  function lineHTML(txt){
    var ln = document.createElement('span'); ln.className = 'ln';
    var li = document.createElement('span'); li.className = 'li'; li.textContent = txt;
    ln.appendChild(li); return ln;
  }

  var present = {};
  cut.scenes.forEach(function(s){ present[s.id] = s; });
  var groups = [];   /* {el, budget, flow} */

  function sceneLines(id){ return (present[id] && present[id].lines) ? present[id].lines : []; }

  ['s1','s2'].forEach(function(id){
    if (!present[id]) return;
    var el = $('hl-' + id);
    sceneLines(id).forEach(function(key){
      if (!has(key)) return;
      sentences(tidy(copy[key])).forEach(function(s){ el.appendChild(lineHTML(s)); });
    });
  });
  var hl3 = $('hl-s3'), hasO1 = false, hasCTA = false;
  if (present.s3) {
    sceneLines('s3').forEach(function(key){
      if (!has(key)) return;
      var role = (F.lines && F.lines[key] && F.lines[key].role) || (key === 'cta' ? 'cta' : 'offer');
      if (role === 'cta') { $('ctaT').textContent = copy[key].trim(); cta.classList.add('on'); hasCTA = true; return; }
      var flow = document.createElement('span'); flow.className = 'flow';
      tidy(copy[key]).split(/ +/).forEach(function(w, i){
        if (i) flow.appendChild(document.createTextNode(' '));
        var sp = document.createElement('span'); sp.className = 'w'; sp.textContent = w; flow.appendChild(sp);
      });
      hl3.appendChild(flow); hasO1 = true;
    });
  }

  function layoutCTA(){
    if (!hasCTA) return;
    var fs = 28*u;
    function apply(){
      cta.style.fontSize = fs + 'px';
      cta.style.height = (92*u) + 'px';
      cta.style.paddingInline = (40*u) + 'px';
      ci.style.gap = (16*u) + 'px';
      arrow.setAttribute('width', 30*u*fs/(28*u)); arrow.setAttribute('height', 22*u*fs/(28*u));
    }
    apply();
    while (cta.offsetWidth > Lay.typeW && fs > 22*u) { fs -= 1; apply(); }
    cta.style.marginTop = hasO1 ? (40*u) + 'px' : '0px';
  }

  function fitHeadlines(){
    var landscape = orient === 'landscape';
    var bottomLimit = H - Math.max(safe.bottom||0, 140*u);
    var ctaBlock = hasCTA ? (132*u) : 0;
    var gap = 40*u;
    var list = [];
    if (present.s1 && $('hl-s1').firstChild) list.push({el:$('hl-s1'), budget: landscape ? bottomLimit - typeTop : (Lay.oy - typeTop - gap)});
    if (present.s2 && $('hl-s2').firstChild) list.push({el:$('hl-s2'), budget: landscape ? bottomLimit - typeTop : (Lay.oy - 40*k - typeTop - gap)});
    if (hasO1) list.push({el:hl3, flow:true, budget: (landscape ? bottomLimit - typeTop : (Lay.oy + 137*k - typeTop - gap)) - ctaBlock});
    if (!list.length) return;
    function fits(g){
      if (g.el.offsetHeight > g.budget) return false;
      if (g.flow) {
        var ws = g.el.querySelectorAll('.w');
        for (var i = 0; i < ws.length; i++) if (ws[i].offsetWidth > Lay.typeW) return false;
        return g.el.scrollWidth <= Lay.typeW + 1;
      }
      var lis = g.el.querySelectorAll('.li');
      for (var j = 0; j < lis.length; j++) if (lis[j].offsetWidth > Lay.typeW * 0.985) return false;
      return true;
    }
    var size = Math.round(Lay.hlMax), min = Math.round(52*u);
    function setAll(s){ list.forEach(function(g){ g.el.style.fontSize = s + 'px'; }); }
    setAll(size);
    while (size > min && !list.every(fits)) { size -= 1; setAll(size); }
    /* offer: freeze balanced wrap into masked lines */
    if (hasO1) {
      var flow = hl3.querySelector('.flow');
      var ws = flow.querySelectorAll('.w'), rows = [], lastTop = null;
      for (var i = 0; i < ws.length; i++) {
        var top = Math.round(ws[i].offsetTop);
        if (lastTop === null || Math.abs(top - lastTop) > 4) { rows.push([]); lastTop = top; }
        rows[rows.length - 1].push(ws[i].textContent);
      }
      hl3.removeChild(flow);
      rows.forEach(function(r){ hl3.appendChild(lineHTML(r.join(' '))); });
    }
  }

  /* ---------- TIMELINE ---------- */
  var tl;
  function build(){
    tl = gsap.timeline({paused:true});
    function init(el, v){ gsap.set(el, v); tl.set(el, v, 0); }
    function lis(id){ return Array.prototype.slice.call($(id).querySelectorAll('.li')); }

    /* initial state */
    init(sheet, {top:0, height:H0, clipPath:RECT});
    init(edge, {top:H0});
    init(print, {autoAlpha:1, y:0});
    init(fanEls, {autoAlpha:0, rotation:0, y:80});
    init(tickEls, {strokeDashoffset:36});
    init(ringwrap, {autoAlpha:0, y:-90});
    init(rshadow, {autoAlpha:0, scaleX:.6});
    init(wm, {autoAlpha:1});
    init(lk, {autoAlpha:0, clipPath:'inset(0% 38.74% 0% 0%)'});
    init(drift, {x:0});
    ['hl-s1','hl-s2','hl-s3'].forEach(function(id){ init($(id), {autoAlpha:1}); });
    if (lis('hl-s2').length) init(lis('hl-s2'), {yPercent:115, filter:'blur(8px)'});
    if (lis('hl-s3').length) init(lis('hl-s3'), {yPercent:115, filter:'blur(8px)'});
    var R = Math.round(46*u);
    if (hasCTA) {
      init(cta, {clipPath:'inset(0% 100% 0% 0% round '+R+'px)'});
      init(ci, {x:-24*ds, autoAlpha:0});
      init(arrow, {x:0});
    }

    /* continuous camera push, settles before the final hold */
    tl.to(drift, {x:-16*ds, duration:Math.max(1, L - 1.2), ease:'sine.inOut'}, 0);

    function reveal(els, at){
      if (!els.length) return;
      tl.to(els, {yPercent:0, duration:0.6, ease:'power4.out', stagger:0.07}, at);
      tl.to(els, {filter:'blur(0px)', duration:0.3, ease:'power4.out', stagger:0.07}, at);
    }
    function toBlock(at, d){
      if (d > 0) {
        tl.to(print, {autoAlpha:0, duration:0.2, ease:'power2.in'}, at);
        tl.to(sheet, {top:220, height:82, clipPath:FACE, duration:d, ease:'expo.inOut'}, at);
        tl.to(edge, {top:302, duration:d, ease:'expo.inOut'}, at);
      } else {
        tl.set(print, {autoAlpha:0}, at);
        tl.set(sheet, {top:220, height:82, clipPath:FACE}, at);
        tl.set(edge, {top:302}, at);
      }
    }

    var SCENES = {
      s1: function(win, lines, ctx){
        var S = win.start, E = win.end;
        var els = lis('hl-s1');
        /* first line is already set at frame 0 (thumbnail); later lines land once the riffle stops on 400 */
        if (els.length > 1) {
          init(els.slice(1), {yPercent:115, filter:'blur(8px)'});
          reveal(els.slice(1), S + riffleDur + 0.06);
        }
        /* top sheet settles after the riffle */
        tl.to(print, {y:1.5, duration:0.08, ease:'power2.out'}, S + riffleDur);
        tl.to(print, {y:0, duration:0.3, ease:'power4.out'}, S + riffleDur + 0.08);
        if (ctx.next === 's2') {
          tl.to($('hl-s1'), {autoAlpha:0, duration:0.25, ease:'power2.in'}, E - 0.3);
          toBlock(E - 0.3, 0.6);
        } else if (ctx.next) {
          tl.set($('hl-s1'), {autoAlpha:0}, E);
          toBlock(E, 0);
        }
      },
      s2: function(win, lines, ctx){
        var S = win.start, E = win.end, d = E - S;
        if (ctx.prev !== 's1') toBlock(S, 0);
        reveal(lis('hl-s2'), S + 0.12);
        tl.to(fanEls, {autoAlpha:1, duration:0.2, ease:'none', stagger:0.05}, S + 0.15);
        tl.to(fanEls, {y:0, duration:0.5, ease:'power4.out', stagger:0.05}, S + 0.15);
        fanSpecs.forEach(function(s, i){
          tl.to(fanEls[i], {rotation:s.r, duration:0.6, ease:'power4.out'}, S + 0.3 + i*0.04);
        });
        var tk = S + Math.max(0.85, 0.35*d);
        tickEls.forEach(function(p, i){
          tl.to(p, {strokeDashoffset:0, duration:0.18, ease:'power2.out'}, tk + i*0.14);
        });
        if (ctx.next) {
          tl.to(fanEls, {rotation:0, duration:0.3, ease:'power2.inOut'}, E - 0.55);
          tl.to(fanEls, {y:70, autoAlpha:0, duration:0.3, ease:'power2.in'}, E - 0.28);
          tl.to($('hl-s2'), {autoAlpha:0, duration:0.25, ease:'power2.in'}, E - 0.3);
        }
      },
      s3: function(win, lines, ctx){
        var S = win.start, E = win.end, d = E - S;
        if (!ctx.prev) toBlock(S, 0);
        var drop = ctx.prev === 's2' ? S - 0.3 : S;
        tl.to(ringwrap, {autoAlpha:1, duration:0.15, ease:'none'}, drop);
        tl.to(ringwrap, {y:0, duration:0.7, ease:'power4.out'}, drop);
        tl.to(rshadow, {autoAlpha:1, scaleX:1, duration:0.7, ease:'power4.out'}, drop);
        /* lockup takes the corner: the wordmark stays, "Concepts" wipes in */
        tl.set(wm, {autoAlpha:0}, S);
        tl.set(lk, {autoAlpha:1}, S);
        tl.to(lk, {clipPath:'inset(0% 0% 0% 0%)', duration:0.5, ease:'power3.out'}, S + 0.05);
        reveal(lis('hl-s3'), S + 0.15);
        if (hasCTA) {
          var c0 = S + (hasO1 ? 0.45 : 0.15);
          tl.to(cta, {clipPath:'inset(0% 0% 0% 0% round '+R+'px)', duration:0.6, ease:'power3.inOut'}, c0);
          tl.to(ci, {x:0, autoAlpha:1, duration:0.45, ease:'expo.out'}, c0 + 0.3);
          var nudge = S + Math.max(1.3, Math.min(2.8, d - 1.8));
          tl.to(arrow, {x:6*ds, duration:0.22, ease:'power2.inOut'}, nudge);
          tl.to(arrow, {x:0, duration:0.28, ease:'power2.inOut'}, nudge + 0.22);
        }
      }
    };

    cut.scenes.forEach(function(win, i){
      var fn = SCENES[win.id];
      if (!fn) return;
      fn(win, win.lines || [], {prev: i > 0 ? cut.scenes[i-1].id : null, next: i < cut.scenes.length - 1 ? cut.scenes[i+1].id : null});
    });
    tl.set({}, {}, L);
  }

  function setup(){
    var p = Promise.resolve();
    if (document.fonts) {
      p = Promise.all([
        document.fonts.load('600 100px "Inter Tight"'),
        document.fonts.load('700 28px "Inter Tight"'),
        document.fonts.load('500 12px "Inter Tight"')
      ]).catch(function(){}).then(function(){ return document.fonts.ready; });
    }
    return p.then(function(){
      var all = Object.keys(copy).map(function(key){ return copy[key]; }).join(' ');
      try { if (document.fonts && all && !document.fonts.check('600 100px "Inter Tight"', all)) stage.classList.add('fallback'); } catch(e){}
      layoutCTA();
      fitHeadlines();
      build();
      window.renderFrame = function(t){
        t = Math.max(0, Math.min(L, +t || 0));
        tl.time(t, false);
        renderRiffle(t);
      };
      drawSheet(1, FMTS[0], LANGS[0]);
      window.renderFrame(0);
    });
  }

  window.renderFrame = function(){};
  if (typeof F.setup === 'function') F.setup(setup);
  else if (document.readyState === 'complete') setup();
  else window.addEventListener('load', setup);
})();
</script>
<script>(function controllerV2() {
  const F = window.FORMA, isStatic = F.stage === 'preview' || F.kind === 'poster';
  if (isStatic) {
    const send = () => {
      try {
        parent.postMessage({type:'forma:time', t:0, duration:0, playing:false, timeline:false, static:true, format:F.format, lang:F.lang, scene:F.scene}, '*');
      } catch {}
    };
    const draw = () => { try { window.renderFrame?.(0); } catch (e) { console.error(e); } send(); };
    addEventListener('message', e => {
      if (e.source !== parent || !e.data) return;
      if (e.data.type === 'forma:hello') send();
    });
    const loaded = document.readyState === 'complete' ? Promise.resolve() : new Promise(r => addEventListener('load', r, {once:true}));
    Promise.all([loaded, document.fonts.ready])
      .then(async () => { for (const fn of F._setups) await fn(); })
      .catch(e => console.error(e))
      .then(() => { F.playing = false; draw(); });
    return;
  }

  const D = F.length, params = new URLSearchParams(location.search);
  let t = Math.max(0, Math.min(D, Number(params.get('t')) || 0)), playing = !params.has('paused'), last = null, started = false;
  const send = () => {
    try {
      parent.postMessage({type:'forma:time', t, duration:D, playing, timeline:typeof window.renderFrame === 'function', format:F.format, lang:F.lang, length:D}, '*');
    } catch {}
  };
  const draw = () => { try { window.renderFrame?.(t); } catch (e) { console.error(e); } send(); };
  function tick(now) {
    if (!playing) return;
    if (last !== null) t = Math.min(D, t + (now - last) / 1000);
    last = now;
    draw();
    if (t >= D) { playing = F.playing = false; send(); return; }
    requestAnimationFrame(tick);
  }
  function play() { if (!started) return; if (t >= D) t = 0; playing = F.playing = true; last = null; requestAnimationFrame(tick); }
  function pause() { playing = F.playing = false; draw(); }
  addEventListener('message', e => {
    if (e.source !== parent || !e.data) return;
    const m = e.data;
    if (m.type === 'forma:play') play();
    if (m.type === 'forma:pause') pause();
    if (m.type === 'forma:seek') { t = Math.max(0, Math.min(D, Number(m.t) || 0)); if (!playing) draw(); }
    if (m.type === 'forma:hello') send();
  });
  const loaded = document.readyState === 'complete' ? Promise.resolve() : new Promise(r => addEventListener('load', r, {once:true}));
  Promise.all([loaded, document.fonts.ready])
    .then(async () => { for (const fn of F._setups) await fn(); })
    .catch(e => console.error(e))
    .then(() => { started = true; F.playing = playing; draw(); if (playing) play(); });
})()</script></body>
