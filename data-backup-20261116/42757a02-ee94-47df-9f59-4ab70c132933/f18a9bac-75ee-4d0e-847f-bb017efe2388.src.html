<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
@font-face {
  font-family: Archivo;
  src: url("assets/sonicdesk/fonts/archivo-latin-700-normal.woff2") format("woff2");
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: Archivo;
  src: url("assets/sonicdesk/fonts/archivo-latin-800-normal.woff2") format("woff2");
  font-weight: 800;
  font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("assets/sonicdesk/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
:root {
  color-scheme: dark;
  --canvas: #070707;
  --paper: #e8e8e8;
  --muted: #9e9e9e;
  --rule: #242424;
  --app: #000000;
  --surface: #0d0d0d;
  --compare-b: #907bff;
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--canvas);
}
body {
  font-family: Archivo, Arial, sans-serif;
  color: var(--paper);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
#viewport {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
}
#frame {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1080px;
  height: 1080px;
  transform: translate(-50%, -50%) scale(var(--scale, 1));
  transform-origin: center;
  background: var(--canvas);
  isolation: isolate;
  --left: 64px;
  --right: 64px;
  --top: 56px;
  --bottom: 64px;
}
.masthead {
  position: absolute;
  left: var(--left);
  right: var(--right);
  top: var(--top);
  height: 120px;
  border-bottom: 1px solid var(--rule);
}
.app-icon {
  display: block;
  width: 80px;
  height: 80px;
}
.copy-zone {
  position: absolute;
  left: var(--left);
  right: var(--right);
  top: calc(var(--top) + 160px);
  height: 248px;
}
.headline {
  margin: 0;
  font-size: 112px;
  font-weight: 800;
  line-height: .965;
  letter-spacing: -.03em;
  white-space: pre-line;
  overflow-wrap: normal;
}
.subline {
  width: fit-content;
  max-width: 100%;
  margin: 38px 0 0;
  padding: 0;
  font-size: 42px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -.025em;
}
.wordmark {
  width: 660px;
  max-width: 100%;
  height: 104px;
  background: var(--paper);
  -webkit-mask: url("assets/sonicdesk/logos/wordmark.svg") left center / contain no-repeat;
  mask: url("assets/sonicdesk/logos/wordmark.svg") left center / contain no-repeat;
}
.cta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 36px;
  width: fit-content;
  max-width: 100%;
  min-height: 108px;
  margin-top: 34px;
  padding: 19px 28px 22px;
  color: var(--canvas);
  background: var(--paper);
}
.cta-copy {
  display: block;
  font-size: 64px;
  line-height: 1;
  font-weight: 700;
  letter-spacing: -.035em;
  white-space: nowrap;
}
.cta-arrow {
  width: 46px;
  height: 46px;
  flex: 0 0 46px;
}
#frame.no-brand .cta { margin-top: 0; }
#frame.no-brand .copy-zone {
  display: flex;
  align-items: center;
}
.hero {
  position: absolute;
  left: calc(var(--left) + 12px);
  right: calc(var(--right) + 12px);
  top: 500px;
  bottom: calc(var(--bottom) + 30px);
  margin: 0;
  transform: rotate(-3deg);
  transform-origin: 50% 50%;
}
.paper-edge, .paper {
  position: absolute;
  inset: 0;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 52px), calc(100% - 52px) 100%, 0 100%);
}
.paper-edge {
  background: var(--muted);
  transform: translate(7px, 8px);
}
.paper {
  background-color: var(--paper);
  background-image: repeating-linear-gradient(
    45deg,
    transparent 0,
    transparent 7px,
    rgba(7, 7, 7, .08) 7px,
    rgba(7, 7, 7, .08) 8px
  );
}
.paper::after {
  content: "";
  position: absolute;
  right: 0;
  bottom: 0;
  width: 52px;
  height: 52px;
  background: var(--muted);
  clip-path: polygon(0 0, 100% 0, 0 100%);
}
.comparison {
  position: absolute;
  inset: 24px 24px 60px;
  display: grid;
  grid-template-rows: 1fr 1fr;
  gap: 20px;
}
.track {
  position: relative;
  min-height: 0;
  background: var(--app);
  border-bottom: 4px solid var(--muted);
}
.track-b { --wave-color: var(--compare-b); }
.track-a { --wave-color: var(--paper); }
.version {
  position: absolute;
  inset: 0 auto 0 0;
  width: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 34px;
  border-right: 1px solid var(--rule);
  font-size: 86px;
  font-weight: 700;
  letter-spacing: -.04em;
}
.ruler {
  position: absolute;
  left: 120px;
  right: 0;
  top: 0;
  height: 44px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  color: var(--muted);
  font-family: "JetBrains Mono", monospace;
  font-weight: 400;
  font-size: 22px;
  line-height: 44px;
}
.ruler span {
  padding-left: 18px;
  border-left: 1px solid var(--rule);
}
.ruler span:first-child { border-left: 0; }
.bar-grid {
  position: absolute;
  top: 44px;
  left: 120px;
  right: 0;
  bottom: 0;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
}
.bar-grid i + i { border-left: 1px solid var(--rule); }
.waveform {
  position: absolute;
  left: 143px;
  right: 22px;
  top: 56px;
  bottom: 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.pill {
  display: block;
  width: 22px;
  flex: 1 1 22px;
  max-width: 22px;
  min-width: 0;
  height: var(--peak);
  border-radius: 999px;
  background: var(--wave-color);
  box-shadow: 3px 4px 0 var(--muted);
}
.track-b .pill { box-shadow: 3px 4px 0 var(--rule); }
.registration {
  position: absolute;
  left: calc(120px + (100% - 120px) / 3);
  top: -24px;
  bottom: -12px;
  width: 2px;
  background: var(--paper);
  z-index: 2;
}
.registration::before,
.registration::after {
  content: "";
  position: absolute;
  left: -5px;
  width: 12px;
  height: 18px;
  background: var(--canvas);
}
.registration::before { top: 0; }
.registration::after { bottom: -12px; }
.photo-caption {
  position: absolute;
  left: 24px;
  right: 70px;
  bottom: 15px;
  margin: 0;
  padding: 3px 5px;
  background: var(--paper);
  color: var(--rule);
  font-family: "JetBrains Mono", monospace;
  font-size: 11.5px;
  font-weight: 400;
  line-height: 1.4;
  letter-spacing: -.02em;
}
#frame[data-scene="s1"] .track-a { transform: translateX(-12px); }
#frame[data-scene="s1"] .track-b { transform: translateX(12px); }
#frame[data-scene="s1"] .registration,
#frame[data-scene="s3"] .registration { display: none; }
#frame[data-scene="s2"] .track {
  border-bottom-width: 1px;
}
#frame[data-scene="s2"] .pill { box-shadow: none; }
#frame[data-scene="s2"] .track-b {
  outline: 1px solid var(--muted);
  outline-offset: -1px;
}
#frame[data-scene="s3"] .hero {
  top: 520px;
}
#frame[data-scene="s3"] .comparison {
  gap: 16px;
}
#frame[data-scene="s3"] .version { font-size: 78px; }
</style>
</head>
<body>
<div id="viewport">
  <main id="frame">
    <header class="masthead">
      <img class="app-icon" src="assets/sonicdesk/logos/app-icon.svg" alt="">
    </header>

    <section class="copy-zone">
      <h1 class="headline" id="headline" hidden></h1>
      <p class="subline" id="subline" hidden></p>
      <div class="wordmark" id="wordmark" role="img" hidden></div>
      <div class="cta" id="cta" hidden>
        <span class="cta-copy" id="cta-copy"></span>
        <svg class="cta-arrow" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M5 24H41M27 10L41 24L27 38" stroke="currentColor" stroke-width="3"/>
        </svg>
      </div>
    </section>

    <figure class="hero">
      <div class="paper-edge" aria-hidden="true"></div>
      <div class="paper">
        <div class="comparison" aria-hidden="true">
          <div class="track track-a">
            <div class="version">A</div>
            <div class="ruler"><span>41</span><span>42</span><span>43</span></div>
            <div class="bar-grid"><i></i><i></i><i></i></div>
            <div class="waveform" id="wave-a"></div>
          </div>
          <div class="track track-b">
            <div class="version">B</div>
            <div class="ruler"><span>41</span><span>42</span><span>43</span></div>
            <div class="bar-grid"><i></i><i></i><i></i></div>
            <div class="waveform" id="wave-b"></div>
          </div>
          <div class="registration"></div>
        </div>
        <figcaption class="photo-caption" id="photo-caption"></figcaption>
      </div>
    </figure>
  </main>
</div>

<script type="application/json" id="forma-motion">
{
  "scenes": {
    "s1": {
      "in": "Неподвижные камера, иконка и заголовок. На чёрный стол с противоположных сторон входят две руки и сдвигают бумажные полосы A и B. Предметная покадровая съёмка на двойках. Никакого искусственного дрожания.",
      "hold": "Две полосы остаются слегка смещёнными. Руки удерживают противоположные края. Реплики появляются только при наличии h1b в выбранной версии. Заголовок неподвижен.",
      "out": "Руки совмещают начала такта 41. Лист остаётся под углом −3°. В четырёхсекундной версии переход сразу к s3."
    },
    "s2": {
      "in": "Полосы фиксируются на общей линейке. Рельефные бумажные pills через точное совмещение становятся цифровым HTML/CSS-интерфейсом: одинаковые размер, положение и формы волн.",
      "hold": "Нейтральная тонкая линейка проходит один и тот же участок сначала A, затем B. Звучат соответствующие записи без маскирующих эффектов. Фиолетовый принадлежит только волне B.",
      "out": "Бумажная подложка вытягивается вниз одним физическим движением. Цифровой слой совмещается с бумажным героем финального кадра."
    },
    "s3": {
      "in": "Движение листа открывает готовый wordmark.svg и прямоугольную нейтральную плашку CTA. Иконка остаётся на прежнем месте. Строка бренда показывается только при наличии brand.",
      "hold": "Полностью неподвижный финал минимум одну секунду. Никакого пульса CTA, волн или логотипа.",
      "out": "Конец на полном финальном кадре."
    }
  },
  "recurring": "Иконка в левом верхнем углу с охранным полем 40 px; чёрный фон; одна бумажная подложка под −3°; две полосы A/B и общий участок тактов 41–43. Для финала формы волн берутся из двух записанных версий; текущая геометрия повторяет supplied referenceSvg.",
  "cuts": {
    "4": [["s1", 0, 1.3], ["s3", 1.3, 4]],
    "8": [["s1", 0, 1.6], ["s2", 1.6, 4.5], ["s3", 4.5, 8]],
    "12": [["s1", 0, 4], ["s2", 4, 7.5], ["s3", 7.5, 12]]
  },
  "reducedMotion": "Неподвижные композиции со склейками.",
  "preview": "Статичный ключевой кадр выбранной FORMA.scene. Анимация и воспроизведение отключены."
}
</script>

<script>
(() => {
  "use strict";
  const F = window.FORMA;
  const frame = document.getElementById("frame");
  const scene = F.scenes.find(item => item.id === F.scene) || F.scenes[0];
  const sceneId = scene.id;
  frame.dataset.scene = sceneId;

  const active = new Set(
    (scene.lines || []).map(line => typeof line === "string" ? line : line.key)
  );
  const read = key =>
    active.has(key) &&
    Object.prototype.hasOwnProperty.call(F.copy, key) &&
    F.copy[key] != null &&
    String(F.copy[key]).trim() !== ""
      ? String(F.copy[key])
      : null;

  const headline = document.getElementById("headline");
  const subline = document.getElementById("subline");
  const wordmark = document.getElementById("wordmark");
  const cta = document.getElementById("cta");
  const ctaCopy = document.getElementById("cta-copy");

  const hook = read("h1");
  const proof = read("p1");
  const sub = read("h1b");
  const brand = read("brand");
  const action = read("cta");

  if (hook || proof) {
    const text = hook || proof;
    headline.textContent = proof
      ? text.replace(/([.!?])\s+/, "$1\n")
      : text;
    headline.hidden = false;
  }
  if (sub) {
    subline.textContent = sub;
    subline.hidden = false;
  }
  if (brand) {
    wordmark.setAttribute("aria-label", brand);
    wordmark.hidden = false;
  }
  if (action) {
    ctaCopy.textContent = action;
    cta.hidden = false;
  }
  frame.classList.toggle("no-brand", sceneId === "s3" && !brand);

  // Heights transcribed from the supplied creative reference, not random audio.
  const peaks = {
    a: [28,68,98,46,24,80,110,62,34,80,102,56,22,60,94,76,32,58,102,72,40,22],
    b: [28,68,98,46,24,80,110,62,60,104,80,36,26,86,108,62,32,66,98,72,40]
  };
  Object.entries(peaks).forEach(([side, values]) => {
    const wave = document.getElementById("wave-" + side);
    const fragment = document.createDocumentFragment();
    values.forEach(height => {
      const pill = document.createElement("i");
      pill.className = "pill";
      pill.style.setProperty("--peak", (height / 120 * 100) + "%");
      fragment.appendChild(pill);
    });
    wave.appendChild(fragment);
  });

  // Production captions describe the missing photography, not campaign copy.
  const photoNotes = {
    s1: "ФОТО · вид сверху: руки с двух сторон сдвигают картонные полосы A/B; матовая бумага, мягкий свет слева.",
    s2: "ФОТО · бумажная подложка, загнутый угол, свет слева; поверх — точный цифровой A/B-интерфейс.",
    s3: "ФОТО · совмещённые картонные полосы A/B на листе с загнутым углом; без рук, мягкий свет слева."
  };
  document.getElementById("photo-caption").textContent = photoNotes[sceneId] || "";

  F.setup(() => {
    const safe = F.safe || {};
    const number = value => Number.isFinite(parseFloat(value)) ? parseFloat(value) : 0;
    frame.style.setProperty("--left", Math.max(64, number(safe.left)) + "px");
    frame.style.setProperty("--right", Math.max(64, number(safe.right)) + "px");
    frame.style.setProperty("--top", Math.max(56, number(safe.top)) + "px");
    frame.style.setProperty("--bottom", Math.max(64, number(safe.bottom)) + "px");

    if (!headline.hidden) F.fit(headline, { max: 112, min: 88 });
    if (!subline.hidden) F.fit(subline, { max: 42, min: 34 });
    if (!cta.hidden) F.fit(ctaCopy, { max: 64, min: 48 });

    const viewport = document.getElementById("viewport");
    const scale = Math.min(viewport.clientWidth / 1080, viewport.clientHeight / 1080);
    frame.style.setProperty("--scale", String(scale));
  });
})();
</script>
</body>
</html>
