/* ---------- timing helpers (142 BPM: beat .42, 1/8 .21) ---------- */
const clamp01=v=>v<0?0:v>1?1:v;

function bz(t,a,b){const u=1-t;return 3*a*u*u*t+3*b*u*t*t+t*t*t}
function E(x){ /* house ease cubic-bezier(0.16,1,0.3,1) */
  if(x<=0)return 0; if(x>=1)return 1;

const GL='ABCDEFGHJKLMNPRSTUVWXYZ0123456789#/+';
function hsh(n){n=(n^61)^(n>>>16);n=n+(n<<3);n=n^(n>>>4);n=Math.imul(n,0x27d4eb2d);n=n^(n>>>15);return n>>>0;}
function scr(s,p,t,seed){

}

/* ---------- hero: the one lime pill ---------- */
function hitH(t){
  let h=96;

}

/* ---------- lanes ---------- */
function lit(i,t){

  for(let i=0;i<N;i++){
    if(i===HI&&t<0.98)continue;
    const half=(t>=3.59&&inSpan(i))?NEW[i]:OLD[i];
    ctx.globalAlpha=0.2+0.8*lit(i,t);
    pill(xc(i),mcy,12,2*half,.5);
  }
  /* V13 lane */
  if(v13on){
    for(let i=0;i<N;i++){
      if(i===HI&&t<2.68)continue;
      const d=Math.abs(i-HI), st=1.06+d*0.004, g=E(seg(t,st,st+0.42));
      if(g<=0)continue;
      const w=12*Math.min(1,g*2.5), h=Math.max(w,2*v13Half(i,t)*g);
      ctx.globalAlpha=0.2+0.8*lit(i,t);
      pill(xc(i),vcy,w,h,.5);
    }
  }
  ctx.globalAlpha=1;

  /* counter window */
  ctx.setTransform(2,0,0,2,0,0);
  const H=hero(t);
  ctx.save(); ctx.beginPath(); ctx.rect(0,633,1080,307); ctx.clip();
  ctx.font='800 168px Archivo, Arial, sans-serif'; setLS('-3px'); ctx.fillStyle=FG;
  let pos=0; ROLLS.forEach(T=>{pos+=rollU(seg(t,T,T+0.21));});
  for(let k=1;k<=4;k++){
    const off=(k-pos)*286; if(off>=300||off<=-300)continue;
    const l1=ENT[k][0], l2=ENT[k][1];
    const m1=ctx.measureText(l1), m2=ctx.measureText(l2);
    const x1=64+m1.actualBoundingBoxLeft, x2=923-m2.actualBoundingBoxRight;
    if(k===4&&t>=4.23){
      ctx.save(); ctx.beginPath(); ctx.rect(64,633,1016,307); ctx.clip();
      const wM=ctx.measureText('MERGE ').width;
      ctx.fillText('MERGE',x1-SHIFT*E(seg(t,4.23,4.44)),770+off);
      ctx.fillText('IT',x1+wM-SHIFT*E(seg(t,4.34,4.55)),770+off);
      const sl=H.cx-H.w/2;
      ctx.beginPath(); ctx.rect(64,633,Math.max(0,sl-64),307); ctx.clip();
      const pb=E(seg(t,4.44,4.65));
      ctx.fillText('BACK',x2-SHIFT*pb,913+off);
      ctx.save(); ctx.translate(57+SHIFT*(1-pb),913); ctx.scale(2,2); ctx.fill(WM); ctx.restore();
      ctx.restore();
    } else {
      ctx.fillText(l1,x1,770+off);
      ctx.fillText(l2,x2,913+off);
    }
  }
  ctx.restore();
  setLS('0px');

  /* hero pill */
  ctx.setTransform(2*C.s,0,0,2*C.s,2*(C.fx-534*C.s),2*(C.fy-300*C.s));
  ctx.fillStyle=LIME; pill(H.cx,H.cy,H.w,H.h,H.rf);

  /* top strip */
  ctx.setTransform(2,0,0,2,0,0);
  ctx.font='500 22px "JetBrains Mono", monospace'; setLS('4px'); ctx.fillStyle=MUTE;
  let key=scr('MASTER · V12',seg(t,0.43,0.85),t,3);
  if(t>=3.59){ const p=seg(t,3.59,3.80); key='MASTER · V1'+(p>=1?'3':String(hsh(Math.floor(t*30)*31+7)%10)); }
  ctx.fillText(key,64,76);
  ctx.font='500 28px "JetBrains Mono", monospace'; setLS('0px'); ctx.fillStyle=FG;
  ctx.fillText(scr('142 BPM · 3:47',seg(t,0.43,0.85),t,4),300,76);

  /* ghost CTA */
  if(t>=4.44){
    const p=E(seg(t,4.44,4.65));
    ctx.font='500 20px "JetBrains Mono", monospace'; setLS('3.6px');
    const label='+ CREATE MY SPACE';
    const tw=ctx.measureText(label).width-3.6;
    const W=Math.round(tw+56), BH=56, X=1016-W, Y=960, P=2*(W+BH);
    ctx.strokeStyle=LINE; ctx.lineWidth=1; ctx.setLineDash([P*p,P+10]);
    ctx.strokeRect(X,Y,W,BH); ctx.setLineDash([]);
    ctx.fillStyle=FG; ctx.textBaseline='middle';
    ctx.fillText(scr(label,p,t,6),X+28,Y+BH/2+1);
    ctx.textBaseline='alphabetic'; setLS('0px');
  }
}

window.renderFrame=function(t){
  t=Math.max(0,Math.min(6,+t||0));
  lastT=t; draw(t);
};
draw(0);
if(document.fonts&&document.fonts.load){
  Promise.all(['800 168px Archivo','500 20px "JetBrains Mono"','400 20px "JetBrains Mono"'].map(f=>document.fonts.load(f)))
    .then(()=>draw(lastT)).catch(()=>{});
}
})();
</script>
<script>document.fonts.ready.then(()=>{(function playShortFilm(draw, requestFrame = requestAnimationFrame) {
  let start;
  function frame(now) {
    start ??= now;
    const t = Math.min(6, (now - start) / 1000);
    draw(t);
    if (t < 6) requestFrame(frame);
  }
  requestFrame(frame);
})(window.renderFrame)})</script></body>
