:root {
  color-scheme: dark;
  --canvas: #070707;

  --bottom: 64px;
}
.masthead {

  right: var(--right);
  top: var(--top);
  height: 120px;

}
.app-icon {
  display: block;
  width: 80px;
  height: 80px;
}
.copy-zone {
  position: absolute;
  left: var(--left);
  right: var(--right);

  height: 248px;
}
.headline {
  margin: 0;
  font-size: 112px;
  font-weight: 800;
  line-height: .965;
  letter-spacing: -.03em;
  white-space: pre-line;
  overflow-wrap: normal;
}
.subline {
  width: fit-content;
  max-width: 100%;

  font-size: 42px;
  font-weight: 700;
  line-height: 1.1;
  letter-spacing: -.025em;
}
.wordmark {

  height: 104px;

.cta {

  max-width: 100%;
  min-height: 108px;
  margin-top: 34px;
  padding: 19px 28px 22px;
  color: var(--canvas);
  background: var(--paper);

.cta-copy {

  font-weight: 700;

  white-space: nowrap;

.cta-arrow {
  width: 46px;
  height: 46px;

#frame.no-brand .cta { margin-top: 0; }
#frame.no-brand .copy-zone {
  display: flex;
  align-items: center;
}
.hero {

  left: calc(var(--left) + 12px);
  right: calc(var(--right) + 12px);
  top: 500px;
  bottom: calc(var(--bottom) + 30px);
  margin: 0;

  transform-origin: 50% 50%;

.paper-edge {

.paper {

<script>
(() => {
  "use strict";
  const F = window.FORMA;
  const frame = document.getElementById("frame");
  const scene = F.scenes.find(item => item.id === F.scene) || F.scenes[0];
  const sceneId = scene.id;
  frame.dataset.scene = sceneId;

  const active = new Set(
    (scene.lines || []).map(line => typeof line === "string" ? line : line.key)
  );
  const read = key =>
    active.has(key) &&
    Object.prototype.hasOwnProperty.call(F.copy, key) &&
    F.copy[key] != null &&
    String(F.copy[key]).trim() !== ""
      ? String(F.copy[key])
      : null;

  const headline = document.getElementById("headline");
  const subline = document.getElementById("subline");
  const wordmark = document.getElementById("wordmark");
  const cta = document.getElementById("cta");
  const ctaCopy = document.getElementById("cta-copy");

  const hook = read("h1");
  const proof = read("p1");
  const sub = read("h1b");
  const brand = read("brand");
  const action = read("cta");

  if (hook || proof) {
    const text = hook || proof;
    headline.textContent = proof
      ? text.replace(/([.!?])\s+/, "$1\n")
      : text;
    headline.hidden = false;
  }
  if (sub) {
    subline.textContent = sub;
    subline.hidden = false;
  }
  if (brand) {
    wordmark.setAttribute("aria-label", brand);
    wordmark.hidden = false;
  }
  if (action) {
    ctaCopy.textContent = action;
    cta.hidden = false;
  }
  frame.classList.toggle("no-brand", sceneId === "s3" && !brand);

  // Heights transcribed from the supplied creative reference, not random audio.
  const peaks = {
    a: [28,68,98,46,24,80,110,62,34,80,102,56,22,60,94,76,32,58,102,72,40,22],
    b: [28,68,98,46,24,80,110,62,60,104,80,36,26,86,108,62,32,66,98,72,40]
  };
  Object.entries(peaks).forEach(([side, values]) => {
    const wave = document.getElementById("wave-" + side);
    const fragment = document.createDocumentFragment();
    values.forEach(height => {
      const pill = document.createElement("i");
      pill.className = "pill";
      pill.style.setProperty("--peak", (height / 120 * 100) + "%");
      fragment.appendChild(pill);
    });
    wave.appendChild(fragment);
  });

  // Production captions describe the missing photography, not campaign copy.
  const photoNotes = {
    s1: "ФОТО · вид сверху: руки с двух сторон сдвигают картонные полосы A/B; матовая бумага, мягкий свет слева.",
    s2: "ФОТО · бумажная подложка, загнутый угол, свет слева; поверх — точный цифровой A/B-интерфейс.",
    s3: "ФОТО · совмещённые картонные полосы A/B на листе с загнутым углом; без рук, мягкий свет слева."
  };
  document.getElementById("photo-caption").textContent = photoNotes[sceneId] || "";

  F.setup(() => {
    const safe = F.safe || {};
    const number = value => Number.isFinite(parseFloat(value)) ? parseFloat(value) : 0;
    frame.style.setProperty("--left", Math.max(64, number(safe.left)) + "px");
    frame.style.setProperty("--right", Math.max(64, number(safe.right)) + "px");
    frame.style.setProperty("--top", Math.max(56, number(safe.top)) + "px");
    frame.style.setProperty("--bottom", Math.max(64, number(safe.bottom)) + "px");

    if (!headline.hidden) F.fit(headline, { max: 112, min: 88 });
    if (!subline.hidden) F.fit(subline, { max: 42, min: 34 });
    if (!cta.hidden) F.fit(ctaCopy, { max: 64, min: 48 });

    const viewport = document.getElementById("viewport");
    const scale = Math.min(viewport.clientWidth / 1080, viewport.clientHeight / 1080);
    frame.style.setProperty("--scale", String(scale));
  });
})();
</script>
<script>(function controllerV2() {
  const F = window.FORMA, isStatic = F.stage === 'preview' || F.kind === 'poster';
  if (isStatic) {
    const send = () => {
      try {
        parent.postMessage({type:'forma:time', t:0, duration:0, playing:false, timeline:false, static:true, format:F.format, lang:F.lang, scene:F.scene}, '*');
      } catch {}
    };
    const draw = () => { try { window.renderFrame?.(0); } catch (e) { console.error(e); } send(); };
    addEventListener('message', e => {
      if (e.source !== parent || !e.data) return;
      if (e.data.type === 'forma:hello') send();
    });
    const loaded = document.readyState === 'complete' ? Promise.resolve() : new Promise(r => addEventListener('load', r, {once:true}));
    Promise.all([loaded, document.fonts.ready])
      .then(async () => { for (const fn of F._setups) await fn(); })
      .catch(e => console.error(e))
      .then(() => { F.playing = false; draw(); });
    return;
  }

  const D = F.length, params = new URLSearchParams(location.search);
  let t = Math.max(0, Math.min(D, Number(params.get('t')) || 0)), playing = !params.has('paused'), last = null, started = false;
  const send = () => {
    try {
      parent.postMessage({type:'forma:time', t, duration:D, playing, timeline:typeof window.renderFrame === 'function', format:F.format, lang:F.lang, length:D}, '*');
    } catch {}
  };
  const draw = () => { try { window.renderFrame?.(t); } catch (e) { console.error(e); } send(); };
  function tick(now) {
    if (!playing) return;
    if (last !== null) t = Math.min(D, t + (now - last) / 1000);
    last = now;
    draw();
    if (t >= D) { playing = F.playing = false; send(); return; }
    requestAnimationFrame(tick);
  }
  function play() { if (!started) return; if (t >= D) t = 0; playing = F.playing = true; last = null; requestAnimationFrame(tick); }
  function pause() { playing = F.playing = false; draw(); }
  addEventListener('message', e => {
    if (e.source !== parent || !e.data) return;
    const m = e.data;
    if (m.type === 'forma:play') play();
    if (m.type === 'forma:pause') pause();
    if (m.type === 'forma:seek') { t = Math.max(0, Math.min(D, Number(m.t) || 0)); if (!playing) draw(); }
    if (m.type === 'forma:hello') send();
  });
  const loaded = document.readyState === 'complete' ? Promise.resolve() : new Promise(r => addEventListener('load', r, {once:true}));
  Promise.all([loaded, document.fonts.ready])
    .then(async () => { for (const fn of F._setups) await fn(); })
    .catch(e => console.error(e))
    .then(() => { started = true; F.playing = playing; draw(); if (playing) play(); });
})()</script></body>
