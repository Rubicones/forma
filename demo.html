<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;background:#17211c;color:#dcff76;font-family:Arial,sans-serif;height:100vh;overflow:hidden;background-image:radial-gradient(ellipse at 45% 45%,#3d5543,transparent 65%)}header,footer{position:absolute;left:6%;right:6%;display:flex;align-items:center;justify-content:space-between;font:2.1vw monospace;letter-spacing:.07em}header{top:6%}footer{bottom:5%;border-top:1px solid #a7be865c;padding-top:2.2%}b{font:900 3.6vw Arial;letter-spacing:-.09em}canvas,#photo{position:absolute;width:100%;height:100%;object-fit:cover}h1{position:absolute;bottom:10%;left:5%;margin:0;font:700 14vw/.84 Arial;letter-spacing:-.095em;max-width:90%;overflow-wrap:anywhere}#photo{opacity:.65}small{position:absolute;top:17%;left:6%;font:2vw monospace;max-width:65%}
</style></head><body><canvas></canvas><header><b>F/M</b><span>DESIGN IN MOTION</span></header><small></small><h1>Форма<br>в движении</h1><footer><span>FORMA STUDIO</span><span>● &nbsp; MOTION STUDY</span></footer><script>
const input=/*INPUT*/null;if(input){document.querySelector('h1').textContent=input.scenario.slice(0,70);document.querySelector('h1').style.fontSize='9vw';document.querySelector('small').textContent=input.style.slice(0,100);if(input.image){let img=new Image();img.id='photo';img.src=input.image;document.body.prepend(img)}}
const c=document.querySelector('canvas'),ctx=c.getContext('2d');function draw(t){let s=c.clientWidth,d=Math.min(devicePixelRatio,2);if(c.width!==Math.round(s*d))c.width=c.height=Math.round(s*d);ctx.setTransform(c.width,0,0,c.height,0,0);ctx.clearRect(0,0,1,1);const rings=[];for(let i=0;i<96;i++){let a=i/96*2*Math.PI,pts=[];for(let j=0;j<=60;j++){let b=j/60*2*Math.PI,r=.27+.105*Math.cos(b),x=r*Math.cos(a),y=r*Math.sin(a),z=.105*Math.sin(b),k=.70+.24*Math.sin(a*2+t*.00045),v=y*Math.cos(k)-z*Math.sin(k),w=y*Math.sin(k)+z*Math.cos(k);pts.push([.54+x*.87-v*.58,.44+x*.48+v*.92,w]);}rings.push(pts)}rings.sort((a,b)=>a[0][2]-b[0][2]);for(let pts of rings){ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.fillStyle='#283625';ctx.fill();ctx.strokeStyle='hsl(77 90% '+(54+pts[0][2]*95)+'%)';ctx.lineWidth=.0028;ctx.stroke()}requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></body></html>
