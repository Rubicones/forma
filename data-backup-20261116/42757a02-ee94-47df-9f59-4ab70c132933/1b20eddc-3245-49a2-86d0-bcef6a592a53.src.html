<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face {
  font-family: Archivo;
  src: url("assets/sonicdesk/fonts/archivo-latin-800-normal.woff2") format("woff2");
  font-weight: 800;
  font-display: swap;
}
@font-face {
  font-family: Archivo;
  src: url("assets/sonicdesk/fonts/archivo-latin-700-normal.woff2") format("woff2");
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("assets/sonicdesk/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
  font-weight: 400;
  font-display: swap;
}
:root {
  color-scheme: dark;
  --u: calc(100vmin / 1080);
  --promo-bg: #070707;
  --fg: #e8e8e8;
  --muted: #9e9e9e;
  --line: #242424;
  --accent: #dfff00;
  --app-bg: #000000;
  --surface: #0d0d0d;
  --surface-2: #141414;
  --compare-b: #907bff;
  --left: calc(64 * var(--u));
  --right: calc(64 * var(--u));
  --top: calc(56 * var(--u));
  --bottom: calc(56 * var(--u));
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--promo-bg);
}
body {
  color: var(--fg);
  font-family: Archivo, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.frame {
  position: relative;
  width: 100vw;
  height: 100vh;
  padding: var(--top) var(--right) var(--bottom) var(--left);
  display: grid;
  grid-template-rows:
    calc(120 * var(--u))
    calc(292 * var(--u))
    minmax(0, 1fr)
    calc(56 * var(--u));
  overflow: hidden;
  isolation: isolate;
}
.masthead {
  position: relative;
  border-bottom: max(1px, calc(1 * var(--u))) solid var(--line);
}
.app-icon {
  display: block;
  width: calc(80 * var(--u));
  height: calc(80 * var(--u));
}
.copy-zone {
  padding-top: calc(40 * var(--u));
  min-width: 0;
}
.headline {
  margin: 0;
  font-size: calc(112 * var(--u));
  line-height: .965;
  letter-spacing: -.03em;
  font-weight: 800;
  text-align: start;
}
.headline .phrase { display: block; white-space: nowrap; }
.subline {
  margin: calc(30 * var(--u)) 0 0;
  font-size: calc(44 * var(--u));
  line-height: 1.12;
  font-weight: 700;
  letter-spacing: -.025em;
  white-space: nowrap;
}
.wordmark {
  display: block;
  width: min(100%, calc(680 * var(--u)));
  aspect-ratio: 477 / 75;
  background: var(--fg);
  -webkit-mask: url("assets/sonicdesk/logos/wordmark.svg") left center / contain no-repeat;
  mask: url("assets/sonicdesk/logos/wordmark.svg") left center / contain no-repeat;
}
.compare {
  position: relative;
  width: calc(100% + var(--right) + 94 * var(--u));
  min-height: 0;
  display: grid;
  grid-template-columns: calc(168 * var(--u)) minmax(0, 1fr);
  grid-template-rows: calc(72 * var(--u)) minmax(0, 1fr) minmax(0, 1fr);
  background: var(--app-bg);
  border: max(1px, calc(2 * var(--u))) solid var(--line);
  overflow: hidden;
}
.mode,
.version,
.ruler,
.wave {
  position: relative;
  min-width: 0;
  min-height: 0;
}
.mode,
.version {
  background: var(--surface);
  border-inline-end: max(1px, calc(2 * var(--u))) solid var(--line);
}
.mode,
.ruler,
.version-a,
.wave-a {
  border-bottom: max(1px, calc(2 * var(--u))) solid var(--line);
}
.mode {
  display: flex;
  align-items: center;
  padding-inline-start: calc(30 * var(--u));
}
.mono {
  font-family: "JetBrains Mono", monospace;
  font-weight: 400;
  font-size: calc(24 * var(--u));
  line-height: 1;
  color: var(--muted);
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
}
.ruler {
  display: flex;
  align-items: center;
  overflow: hidden;
}
.bar-number {
  flex: 0 0 calc(234 * var(--u));
  padding-inline-start: calc(26 * var(--u));
}
.version {
  display: grid;
  place-items: center;
  font-size: calc(96 * var(--u));
  line-height: 1;
  font-weight: 700;
  letter-spacing: -.04em;
}
.version::after {
  content: "";
  position: absolute;
  inset: calc(24 * var(--u)) calc(22 * var(--u));
  border: max(1px, calc(2 * var(--u))) solid transparent;
  pointer-events: none;
}
.frame[data-scene="s2"] .version-a::after {
  border-color: rgba(232, 232, 232, .5);
  background: rgba(232, 232, 232, .015);
}
.wave {
  display: flex;
  align-items: center;
  gap: calc(7 * var(--u));
  padding-inline-start: calc(28 * var(--u));
  overflow: hidden;
}
.pill {
  position: relative;
  z-index: 1;
  flex: 0 0 calc(17 * var(--u));
  height: calc(var(--peak) * 1%);
  max-height: calc(150 * var(--u));
  border-radius: 999px;
  background: var(--fg);
  opacity: .25;
}
.wave-b .pill {
  background: var(--compare-b);
  opacity: .45;
}
.grid-lines {
  position: absolute;
  inset: calc(72 * var(--u)) 0 0 calc(168 * var(--u));
  pointer-events: none;
  display: flex;
}
.grid-bar {
  flex: 0 0 calc(234 * var(--u));
  border-inline-end: max(1px, calc(2 * var(--u))) solid var(--line);
}
.playhead {
  position: absolute;
  z-index: 3;
  top: calc(58 * var(--u));
  bottom: calc(16 * var(--u));
  left: calc(400 * var(--u));
  width: max(1px, calc(2 * var(--u)));
  background: var(--fg);
}
.playhead::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: calc(16 * var(--u));
  height: calc(12 * var(--u));
  background: var(--fg);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.footer {
  display: flex;
  align-items: end;
  gap: calc(30 * var(--u));
  min-width: 0;
}
.footer-rule {
  flex: 1;
  height: 1px;
  margin-bottom: calc(10 * var(--u));
  background: var(--line);
}
.cta-zone { min-width: 0; }
.cta-plate {
  width: 100%;
  min-height: calc(144 * var(--u));
  padding: calc(28 * var(--u)) calc(32 * var(--u));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: calc(24 * var(--u));
  border: max(1px, calc(2 * var(--u))) solid var(--line);
  background: var(--surface-2);
}
.cta-copy {
  min-width: 0;
  margin: 0;
  font-size: calc(64 * var(--u));
  line-height: 1;
  font-weight: 700;
  letter-spacing: -.03em;
  white-space: nowrap;
}
.cta-arrow {
  width: calc(56 * var(--u));
  height: calc(56 * var(--u));
  flex: 0 0 auto;
  color: var(--fg);
}
.frame[data-scene="s3"] {
  grid-template-rows:
    calc(120 * var(--u))
    calc(236 * var(--u))
    minmax(0, 1fr)
    calc(190 * var(--u))
    calc(40 * var(--u));
}
.frame[data-scene="s3"] .copy-zone {
  display: flex;
  align-items: center;
  padding-top: 0;
}
.frame[data-scene="s3"] .cta-zone {
  display: flex;
  align-items: center;
}
.frame[data-scene="s3"] .version {
  font-size: calc(80 * var(--u));
}
.frame[data-scene="s3"].without-brand {
  grid-template-rows:
    calc(120 * var(--u))
    calc(80 * var(--u))
    minmax(0, 1fr)
    calc(190 * var(--u))
    calc(40 * var(--u));
}
.frame[data-scene="s3"].without-cta {
  grid-template-rows:
    calc(120 * var(--u))
    calc(236 * var(--u))
    minmax(0, 1fr)
    0
    calc(56 * var(--u));
}
</style>
</head>
<body>
<main class="frame" id="frame">
  <header class="masthead">
    <img class="app-icon" src="assets/sonicdesk/logos/app-icon.svg" alt="">
  </header>

  <section class="copy-zone">
    <div id="text-block">
      <h1 class="headline" id="headline" hidden></h1>
      <p class="subline" id="subline" hidden></p>
    </div>
    <div class="wordmark" id="wordmark" role="img" hidden></div>
  </section>

  <section class="compare" aria-hidden="true">
    <div class="mode mono" id="mode"></div>
    <div class="ruler mono" id="ruler"></div>
    <div class="version version-a" id="version-a"></div>
    <div class="wave wave-a" id="wave-a"></div>
    <div class="version version-b" id="version-b"></div>
    <div class="wave wave-b" id="wave-b"></div>
    <div class="grid-lines" id="grid-lines"></div>
    <div class="playhead"></div>
  </section>

  <section class="cta-zone" id="cta-zone" hidden>
    <div class="cta-plate">
      <p class="cta-copy" id="cta"></p>
      <svg class="cta-arrow" viewBox="0 0 56 56" fill="none" aria-hidden="true">
        <path d="M7 28H47M30 11L47 28L30 45" stroke="currentColor" stroke-width="3"/>
      </svg>
    </div>
  </section>

  <footer class="footer" aria-hidden="true">
    <span class="mono" id="position"></span>
    <span class="footer-rule"></span>
  </footer>
</main>

<script type="application/json" id="forma-motion">
{
  "scenes": {
    "s1": {
      "in": "Иконка закреплена в левом верхнем углу. Вопрос появляется целиком. Две дорожки входят навстречу друг другу на 40 px и фиксируются в общей сетке; easing cubic-bezier(0.16,1,0.3,1).",
      "hold": "В полной 12-секундной версии две реплики последовательно появляются на общей базовой линии. После появления весь текст неподвижен. В коротких версиях отсутствующие строки не занимают место.",
      "out": "Дорожки и отметка сохраняют координаты. Вопрос сменяется доказательством. В 4-секундной версии прямой переход к финальному состоянию."
    },
    "s2": {
      "in": "Заголовок сменяется на две строки доказательства. Нейтральный контур фиксирует сторону A; начальная позиция обеих версий одинакова.",
      "hold": "Ключевой кадр — пауза: обе волны не проиграны, курсор общий. В финальном видео сначала звучит участок A, затем тот же участок B с возвратом курсора к одной позиции. Громкость сопоставима; победитель не обозначается.",
      "out": "Таймлайн сжимается по вертикали, сохраняя левый столбец, расположение тактов и горизонтальную координату курсора. Освобождается пространство для wordmark и CTA."
    },
    "s3": {
      "in": "Появляется supplied wordmark, если строка brand присутствует. CTA занимает нейтральную прямоугольную плашку под дорожками; без увеличения или деформации логотипа.",
      "hold": "Финальный кадр полностью неподвижен не менее последней секунды. Единственный лаймовый акцент — постоянная иконка.",
      "out": "Неподвижная выдержка до конца ролика, без затемнения CTA."
    }
  },
  "recurring": "Supplied app-icon.svg в одной позиции с охранным полем 40 px; общий левый край, две A/B-дорожки, неизменные аудиопики и одна вертикальная контрольная отметка.",
  "cuts": {
    "4": [["s1",0,1.3],["s3",1.3,4]],
    "8": [["s1",0,1.6],["s2",1.6,4.5],["s3",4.5,8]],
    "12": [["s1",0,4],["s2",4,7.5],["s3",7.5,12]]
  },
  "reducedMotion": "Жёсткие смены статичных состояний; без перемещения дорожек и курсора.",
  "preview": "Статичный ключевой кадр выбранной сцены. Анимация, таймеры и воспроизведение отсутствуют."
}
</script>

<script>
(() => {
  "use strict";
  const F = window.FORMA;
  const frame = document.getElementById("frame");
  const sceneId = typeof F.scene === "string" ? F.scene : F.scene?.id;
  const selected = F.scenes.find(scene => scene.id === sceneId) || F.scenes[0];
  const current = selected?.id || sceneId;
  frame.dataset.scene = current;

  const copy = F.copy || {};
  const keys = new Set(selected?.lines || []);
  const has = key =>
    Object.prototype.hasOwnProperty.call(copy, key) &&
    copy[key] != null &&
    String(copy[key]).trim().length > 0 &&
    (keys.size === 0 || keys.has(key));

  const headline = document.getElementById("headline");
  const subline = document.getElementById("subline");
  const wordmark = document.getElementById("wordmark");
  const cta = document.getElementById("cta");
  const ctaZone = document.getElementById("cta-zone");

  const mainKey = current === "s1" ? "h1" : current === "s2" ? "p1" : null;
  if (mainKey && has(mainKey)) {
    headline.hidden = false;
    const value = String(copy[mainKey]);
    const phrases = current === "s2"
      ? value.match(/[^.!?]+[.!?]+(?:[»”])?|[^.!?]+$/g) || [value]
      : [value];
    phrases.forEach(phrase => {
      const line = document.createElement("span");
      line.className = "phrase";
      line.textContent = phrase.trim();
      headline.appendChild(line);
    });
  }

  if (current === "s1" && has("h1b")) {
    subline.textContent = copy.h1b;
    subline.hidden = false;
  }

  if (current === "s3") {
    document.getElementById("text-block").hidden = true;
    if (has("brand")) {
      wordmark.hidden = false;
      wordmark.setAttribute("aria-label", String(copy.brand));
    } else {
      frame.classList.add("without-brand");
    }
    if (has("cta")) {
      cta.textContent = copy.cta;
      ctaZone.hidden = false;
    } else {
      frame.classList.add("without-cta");
    }
  }

  // Demonstration data for the product surface, not campaign copy.
  const demo = {
    versions: ["A", "B"],
    bars: [41, 42, 43, 44, 45],
    position: { bar: 42, beat: 1 },
    peaks: [
      [18,38,58,27,15,47,72,40,19,33,50,20,14,32,59,43,15,23,49,37,15,27,60,43,20,14,34,53,39,16,29,52,32,15,23,48,68,42,26,16,39,55],
      [18,38,58,27,15,47,72,40,19,43,65,52,34,18,50,62,38,23,49,37,15,27,60,43,20,14,34,53,39,16,29,52,32,15,23,48,68,42,26,16,39,55]
    ]
  };

  document.getElementById("mode").textContent = demo.versions.join("/");
  demo.versions.forEach((version, index) => {
    document.getElementById(index ? "version-b" : "version-a").textContent = version;
    const wave = document.getElementById(index ? "wave-b" : "wave-a");
    demo.peaks[index].forEach(peak => {
      const pill = document.createElement("i");
      pill.className = "pill";
      pill.style.setProperty("--peak", peak);
      wave.appendChild(pill);
    });
  });

  demo.bars.forEach(bar => {
    const label = document.createElement("span");
    label.className = "bar-number";
    label.textContent = String(bar);
    document.getElementById("ruler").appendChild(label);

    const gridBar = document.createElement("span");
    gridBar.className = "grid-bar";
    document.getElementById("grid-lines").appendChild(gridBar);
  });

  document.getElementById("position").textContent =
    [demo.position.bar, demo.position.beat].join(".");

  const safe = F.safe || {};
  for (const [edge, minimum] of Object.entries({
    left: 64, right: 64, top: 56, bottom: 56
  })) {
    const value = Number(safe[edge]);
    frame.style.setProperty(
      "--" + edge,
      `calc(${Math.max(minimum, Number.isFinite(value) ? value : 0)} * var(--u))`
    );
  }

  F.setup(() => {
    const scale = Math.min(window.innerWidth, window.innerHeight) / 1080;
    const phrases = Array.from(headline.querySelectorAll(".phrase"));
    if (phrases.length) {
      F.fitGroup(phrases, { max: 112 * scale, min: 84 * scale });
    }
    if (!subline.hidden) {
      F.fit(subline, { max: 44 * scale, min: 34 * scale });
    }
    if (!ctaZone.hidden) {
      F.fit(cta, { max: 64 * scale, min: 48 * scale });
    }
  });
})();
</script>
</body>
</html>
