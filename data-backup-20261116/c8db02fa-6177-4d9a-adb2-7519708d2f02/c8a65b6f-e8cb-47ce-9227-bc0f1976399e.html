<head><script type="importmap">{"imports":{"three":"/lib/three/build/three.module.js","three/addons/":"/lib/three/examples/jsm/"}}</script><script src="/lib/gsap.js"></script><script src="/lib/lottie.js"></script>

<style>
@font-face{font-family:Inter Tight;src:url("assets/Toggle_Concepts_Brand_Pack/fonts/InterTight-Medium.ttf") format("truetype");font-weight:500;font-display:block}
@font-face{font-family:Inter Tight;src:url("assets/Toggle_Concepts_Brand_Pack/fonts/InterTight-SemiBold.ttf") format("truetype");font-weight:600;font-display:block}
@font-face{font-family:Inter Tight;src:url("assets/Toggle_Concepts_Brand_Pack/fonts/InterTight-Bold.ttf") format("truetype");font-weight:700;font-display:block}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1080px;overflow:hidden;background:#0C2B3F}
body{font-family:Inter Tight,Arial,sans-serif;color:#fff}
main{position:relative;width:1080px;height:1080px;overflow:hidden;isolation:isolate}
svg.scene{position:absolute;inset:0;width:1080px;height:1080px}
.brand{position:absolute;left:108px;top:108px;height:40px;display:flex;align-items:center;gap:24px}
.brand-symbol{position:relative;width:96px;height:36px;overflow:hidden}
.brand-symbol img{position:absolute;width:113px;height:auto;left:-8px;top:-8px}
.brand-name{font-weight:500;font-size:30px;letter-spacing:-.7px;white-space:nowrap}
.hook{position:absolute;left:108px;top:204px;margin:0;font-size:48px;line-height:1.1;font-weight:600;letter-spacing:-1.7px;clip-path:inset(0 100% 0 0)}
.payoff{position:absolute;left:108px;top:651px;width:864px;clip-path:inset(0 0 100% 0)}
h1{margin:0;font-size:76px;font-weight:600;line-height:.99;letter-spacing:-2.8px}
.offer{margin:30px 0 0;font-size:35px;line-height:42px;font-weight:500;letter-spacing:-.6px}
.cta{position:absolute;left:108px;top:892px;width:864px;height:80px;border-radius:40px;background:#fff;color:#0C2B3F;display:flex;align-items:center;justify-content:space-between;padding:0 40px;text-decoration:none;font-size:31px;font-weight:700;letter-spacing:.1px;clip-path:inset(0 0 100% 0)}
.cta svg{width:48px;height:32px;flex:none}
.cta:focus-visible{outline:3px solid #B4E4FA;outline-offset:8px}
</style>
</head>
<body>
<main aria-label="Toggle Concepts. Pay for concepts. Every version is included. 20% off your first month.">
<svg class="scene" viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<defs>
<!-- Exact supplied Toggle symbol path, used as the projection gobo. -->
<path id="pill" d="M320.3 .72C164.2 7.18 164.4 235.46 320.3 241.82C320.3 241.82 746.5 242.12 746.9 242.12C804.39 242.34 852.46 211.63 868.3 158.77C892.96 77.26 833.18 -3.41 745.75 .58C745.75 .58 504.05 .73 320.3 .73V.72ZM744.58 75.22C803.34 75.22 805.18 166.77 746.9 167.52C746.9 167.52 391.75 167.18 324.25 167.12C286.86 163.79 276.6 111.06 300.7 86.82C306.77 80.45 314.55 75.57 324.25 75.57C361.46 75.57 744.58 75.22 744.58 75.22Z"/>
<radialGradient id="wall" cx="75%" cy="43%" r="62%">
<stop offset="0" stop-color="#3A5B71" stop-opacity=".72"/>
<stop offset=".58" stop-color="#193C51" stop-opacity=".35"/>
<stop offset="1" stop-color="#0C2B3F" stop-opacity="0"/>
</radialGradient>
<linearGradient id="beam" x1="0" y1=".5" x2="1" y2=".5">
<stop stop-color="#B4E4FA" stop-opacity=".03"/>
<stop offset=".45" stop-color="#B4E4FA" stop-opacity=".12"/>
<stop offset="1" stop-color="#B4E4FA" stop-opacity=".36"/>
</linearGradient>
<linearGradient id="innerLight" x1="0" y1="0" x2="1" y2="0">
<stop stop-color="#B4E4FA" stop-opacity="0"/>
<stop offset="1" stop-color="#B4E4FA" stop-opacity=".14"/>
</linearGradient>
<linearGradient id="projection" x1="0" y1="0" x2="0" y2="1">
<stop stop-color="#FFFFFF"/>
<stop offset=".45" stop-color="#F3FBFF"/>
<stop offset="1" stop-color="#B4E4FA"/>
</linearGradient>
<filter id="haze" x="-30%" y="-60%" width="160%" height="220%">
<feGaussianBlur stdDeviation="15"/>
</filter>
<filter id="halation" x="-15%" y="-40%" width="130%" height="180%">
<feGaussianBlur stdDeviation="7"/>
</filter>
<clipPath id="opticalArea"><rect x="0" y="290" width="1080" height="358"/></clipPath>
</defs>
<rect width="1080" height="1080" fill="#0C2B3F"/>
<rect x="0" y="200" width="1080" height="510" fill="url(#wall)"/>
<g clip-path="url(#opticalArea)">
<path id="hazeBeam" fill="url(#beam)" filter="url(#haze)" opacity=".55"/>
<path id="beamShape" fill="url(#beam)"/>
<path id="innerBeam" fill="url(#innerLight)"/>
<path id="upperEdge" fill="none" stroke="#B4E4FA" stroke-width="1" stroke-opacity=".27"/>
<path id="lowerEdge" fill="none" stroke="#B4E4FA" stroke-width="1" stroke-opacity=".3"/>
<g id="traces" fill="none" stroke="#B4E4FA" stroke-width="1">
<path d="M276 434V582L296 587V430Z" opacity=".20"/>
<path d="M440 397V606L466 612V391Z" opacity=".18"/>
<path d="M604 359V628L633 635V352Z" opacity=".16"/>
</g>
<g id="aperture">
<path id="gateFill" fill="#081F2E" fill-opacity=".72" fill-rule="evenodd"/>
<path id="gateEdge" fill="none" stroke="#B4E4FA" stroke-width="1.4" stroke-opacity=".6"/>
</g>
<g id="projectedSymbol">
<use href="#pill" transform="translate(122 360) scale(.97)" fill="#B4E4FA" opacity=".19" filter="url(#halation)"/>
<use href="#pill" transform="translate(122 360) scale(.97)" fill="url(#projection)"/>
</g>
<path id="source" d="M108 510V536" fill="none" stroke="#B4E4FA" stroke-width="3"/>
</g>
<path id="revealEdge" d="M108 644H972" fill="none" stroke="#B4E4FA" stroke-width="1" opacity="0"/>
<path id="completion" d="M108 877H108" fill="none" stroke="#FF4F17" stroke-width="2"/>
</svg>

<div class="brand">
<div class="brand-symbol"><img src="assets/Toggle_Concepts_Brand_Pack/logo/toggle-symbol-white.svg" alt=""></div>
<span class="brand-name">Toggle Concepts</span>
</div>
<p class="hook" id="hook">Pay for concepts.</p>
<div class="payoff" id="payoff">
<h1>Every version<br>is included.</h1>
<p class="offer">20% off your first month</p>
</div>
<a class="cta" id="cta" href="https://concepts.toggle.studio" aria-label="Start a test month">
<span>START A TEST MONTH</span>
<svg viewBox="0 0 48 32" fill="none" aria-hidden="true"><path d="M1 16H44M30 2L44 16L30 30" stroke="currentColor" stroke-width="3"/></svg>
</a>
</main>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const clamp=x=>Math.max(0,Math.min(1,x));
const phase=(t,a,b)=>clamp((t-a)/(b-a));
const smooth=x=>x*x*(3-2*x);
const out=x=>1-Math.pow(1-x,4);
const mix=(a,b,p)=>a+(b-a)*p;
const attr=(id,key,value)=>$(id).setAttribute(key,value);

/*
0.00–0.40  Moving light; enlarged impression occluded by right edge.
0.40–1.30  Light decelerates; the hook is fully exposed.
1.30–1.55  Optical mask contracts in anticipation.
1.55–2.85  One aperture changes portrait → square → landscape.
2.85–3.40  Mask clears; projection settles front-facing.
3.40–4.00  Lower light boundary uncovers the payoff.
4.00–4.65  The same boundary uncovers offer and CTA; orange rule settles.
4.65–6.00  Complete, motionless final hold.
*/
window.renderFrame=function(time){
const t=Math.max(0,Math.min(6,Number(time)||0));
const arrival=out(phase(t,0,1.3));
const settle=out(phase(t,2.85,3.4));
const drift=mix(215,50,arrival)*(1-settle);
const sourceY=mix(479,527,arrival);
const topY=mix(303,342,arrival);
const baseY=mix(610,635,arrival);
const endX=972+drift;
let boundary=644;
if(t>=3.4&&t<4) boundary=mix(644,807,smooth(phase(t,3.4,4)));
if(t>=4) boundary=mix(807,981,smooth(phase(t,4,4.65)));
const bottomY=t<3.4?baseY:boundary;
const beam="M108 "+sourceY+"L"+endX+" "+topY+"V"+bottomY+"Z";
attr("beamShape","d",beam);
attr("hazeBeam","d",beam);
attr("innerBeam","d","M108 "+sourceY+"L"+endX+" "+(topY+62)+"V"+(baseY-44)+"Z");
attr("upperEdge","d","M108 "+sourceY+"L"+endX+" "+topY);
attr("lowerEdge","d","M108 "+sourceY+"L"+endX+" "+bottomY);
attr("source","d","M108 "+(sourceY-13)+"V"+(sourceY+13));
attr("projectedSymbol","transform","translate("+drift+" "+mix(-22,0,arrival)+")");
$("hook").style.clipPath="inset(0 "+(100*(1-out(phase(t,.25,1.3))))+"% 0 0)";

const anticipate=smooth(phase(t,1.3,1.55));
const travel=smooth(phase(t,1.55,2.85));
const clear=smooth(phase(t,2.85,3.4));
const gx=mix(280,648,travel)+clear*420;
const cy=495;
let w=38,h=176;
if(t<1.55){w=mix(48,38,anticipate);h=mix(200,176,anticipate);}
else if(t<2.18){
const p=smooth(phase(t,1.55,2.18));w=mix(38,88,p);h=mix(176,135,p);
}else{
const p=smooth(phase(t,2.18,2.85));w=mix(88,148,p);h=mix(135,94,p);
}
const slant=16;
const outer="M"+(gx-15)+" "+(cy-174)+"L"+(gx+w+15)+" "+(cy-174-slant)+"V"+(cy+174+slant)+"L"+(gx-15)+" "+(cy+174)+"Z";
const hole="M"+gx+" "+(cy-h/2)+"L"+(gx+w)+" "+(cy-h/2-slant)+"V"+(cy+h/2+slant)+"L"+gx+" "+(cy+h/2)+"Z";
attr("gateFill","d",outer+" "+hole);
attr("gateEdge","d",hole);
attr("aperture","opacity",t>=3.4?0:1-clear);
attr("traces","opacity",mix(.25,1,settle));

const payoffHeight=220;
const revealed=clamp((boundary-651)/payoffHeight);
$("payoff").style.clipPath="inset(0 0 "+((1-revealed)*100)+"% 0)";
const ctaReveal=clamp((boundary-892)/80);
$("cta").style.clipPath="inset(0 0 "+((1-ctaReveal)*100)+"% 0)";
$("cta").style.pointerEvents=ctaReveal===1?"auto":"none";
$("cta").tabIndex=ctaReveal===1?0:-1;
attr("revealEdge","d","M108 "+boundary+"H972");
attr("revealEdge","opacity",t>=3.4&&t<4.65?.24:0);
attr("completion","d","M108 877H"+mix(108,172,out(phase(t,4.35,4.65))));
};
window.renderFrame(0);
})();
</script>
<script>document.fonts.ready.then(()=>{(function playShortFilm(draw, requestFrame = requestAnimationFrame) {
  let start;
  function frame(now) {
    start ??= now;
    const t = Math.min(6, (now - start) / 1000);
    draw(t);
    if (t < 6) requestFrame(frame);
  }
  requestFrame(frame);
})(window.renderFrame)})</script></body>
