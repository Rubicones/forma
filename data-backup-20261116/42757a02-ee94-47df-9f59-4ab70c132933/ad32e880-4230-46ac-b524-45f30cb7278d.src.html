<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<style>
@font-face {
  font-family: Archivo;
  src: url("assets/sonicdesk/fonts/archivo-latin-800-normal.woff2") format("woff2");
  font-style: normal;
  font-weight: 800;
  font-display: block;
  unicode-range: U+0000-024F,U+2000-206F;
}
@font-face {
  font-family: Archivo;
  src: url("assets/sonicdesk/fonts/archivo-latin-700-normal.woff2") format("woff2");
  font-style: normal;
  font-weight: 700;
  font-display: block;
  unicode-range: U+0000-024F,U+2000-206F;
}
@font-face {
  font-family: "JetBrains Mono";
  src: url("assets/sonicdesk/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2");
  font-style: normal;
  font-weight: 400;
  font-display: block;
}
:root {
  color-scheme: dark;
  --promo-bg: #070707;
  --fg: #e8e8e8;
  --muted: #9e9e9e;
  --line: #242424;
  --accent: #dfff00;
  --app-bg: #000000;
  --surface: #0d0d0d;
  --surface-2: #141414;
  --compare-b: #907bff;
  --left: max(calc(var(--s) * 5.925926), var(--safe-left, 0px));
  --right: max(calc(var(--s) * 5.925926), var(--safe-right, 0px));
  --top: max(calc(var(--s) * 5.185185), var(--safe-top, 0px));
  --bottom: max(calc(var(--s) * 5.185185), var(--safe-bottom, 0px));
  --header-height: calc(var(--s) * 11.111111);
  --label-width: calc(var(--s) * 15.555556);
  --ruler-height: calc(var(--s) * 6.666667);
  --bar-width: calc(var(--s) * 21.666667);
  --headline-size: calc(var(--s) * 10.370370);
  --sub-size: calc(var(--s) * 4.074074);
  --cta-size: calc(var(--s) * 5.925926);
}
* { box-sizing: border-box; }
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--promo-bg);
}
body {
  color: var(--fg);
  font-family: Archivo, Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
.stage {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  isolation: isolate;
}
.masthead {
  position: absolute;
  z-index: 10;
  inset-inline-start: var(--left);
  inset-inline-end: var(--right);
  top: var(--top);
  height: var(--header-height);
  border-bottom: 1px solid var(--line);
}
.app-icon {
  display: block;
  width: calc(var(--s) * 7.407407);
  height: calc(var(--s) * 7.407407);
}
.scene-layout {
  --copy-row: calc(var(--s) * 27.037037);
  --cta-row: 0px;
  --footer-row: calc(var(--s) * 5.185185);
  position: absolute;
  z-index: 2;
  inset: 0;
  padding-block: var(--top) var(--bottom);
  padding-inline: var(--left) var(--right);
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows:
    var(--header-height)
    var(--copy-row)
    minmax(0, 1fr)
    var(--cta-row)
    var(--footer-row);
  visibility: hidden;
  pointer-events: none;
}
.copy-zone {
  grid-column: 1;
  grid-row: 2;
  min-width: 0;
  min-height: 0;
  padding-top: calc(var(--s) * 3.703704);
  text-align: start;
}
.headline {
  width: 100%;
  height: calc(var(--headline-size) * 1.02);
  margin: 0;
  font-size: var(--headline-size);
  line-height: .965;
  letter-spacing: -.03em;
  font-weight: 800;
  text-align: start;
  text-wrap: balance;
  hyphens: none;
  overflow-wrap: normal;
}
.headline[data-role="proof"] {
  height: calc(var(--headline-size) * 2.04);
}
.line-mask {
  display: block;
  overflow: hidden;
  padding-block: .08em;
  margin-block: -.08em;
}
.line-inner {
  display: block;
  white-space: nowrap;
  transform-origin: center;
}
.subline {
  width: 100%;
  height: calc(var(--sub-size) * 1.35);
  margin: calc(var(--s) * 2.777778) 0 0;
  font-size: var(--sub-size);
  line-height: 1.12;
  font-weight: 700;
  letter-spacing: -.025em;
  text-align: start;
  text-wrap: pretty;
  white-space: nowrap;
  hyphens: none;
  overflow-wrap: normal;
}
.subline:first-child { margin-top: 0; }
.quote-mask {
  display: inline-block;
  overflow: hidden;
  padding-block: .08em;
  margin-block: -.08em;
  vertical-align: top;
}
.quote-inner { display: block; }
.brand-mask {
  width: min(100%, calc(var(--s) * 62.962963));
  padding-block: calc(var(--s) * .8);
  margin-block: calc(var(--s) * -.8);
  overflow: hidden;
}
.wordmark {
  display: block;
  width: 100%;
  aspect-ratio: 477 / 75;
  background: var(--fg);
  -webkit-mask: url("assets/sonicdesk/logos/wordmark.svg") left center / contain no-repeat;
  mask: url("assets/sonicdesk/logos/wordmark.svg") left center / contain no-repeat;
}
.hero-slot {
  grid-column: 1;
  grid-row: 3;
  width: calc(100% + var(--right) + var(--s) * 8.703704);
  min-width: 0;
  min-height: 0;
}
.footer-slot {
  grid-column: 1;
  grid-row: 5;
  min-width: 0;
  min-height: 0;
}
.cta-zone {
  grid-column: 1;
  grid-row: 4;
  min-width: 0;
  min-height: 0;
  display: flex;
  align-items: center;
}
.cta-plate {
  position: relative;
  width: 100%;
  min-height: calc(var(--s) * 13.333333);
  padding: calc(var(--s) * 2.592593) calc(var(--s) * 2.962963);
  display: flex;
  align-items: center;
  gap: calc(var(--s) * 2.222222);
}
.cta-background {
  position: absolute;
  inset: 0;
  border: 2px solid var(--line);
  background: var(--surface-2);
  transform-origin: left center;
}
.cta-text-mask {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  padding-block: .1em;
  margin-block: -.1em;
  font-size: var(--cta-size);
}
.cta-copy {
  width: 100%;
  height: 1.12em;
  margin: 0;
  font-size: var(--cta-size);
  line-height: 1.12;
  letter-spacing: -.03em;
  font-weight: 700;
  white-space: nowrap;
  text-align: start;
  hyphens: none;
}
.cta-arrow {
  position: relative;
  width: calc(var(--s) * 5.185185);
  height: calc(var(--s) * 5.185185);
  flex: 0 0 auto;
  overflow: hidden;
}
.cta-arrow svg {
  display: block;
  width: 100%;
  height: 100%;
}
.scene-layout[data-id="s3"] {
  --copy-row: calc(var(--s) * 21.851852);
  --cta-row: calc(var(--s) * 17.592593);
  --footer-row: calc(var(--s) * 3.703704);
}
.scene-layout[data-id="s3"] .copy-zone {
  display: flex;
  align-items: center;
  padding-top: 0;
}
.scene-layout.without-brand,
.scene-layout.empty-copy {
  --copy-row: calc(var(--s) * 7.407407);
}
.scene-layout.without-cta {
  --cta-row: 0px;
  --footer-row: calc(var(--s) * 5.185185);
}
.compare {
  position: absolute;
  z-index: 1;
  display: grid;
  grid-template-columns: var(--label-width) minmax(0, 1fr);
  grid-template-rows: var(--ruler-height) minmax(0, 1fr) minmax(0, 1fr);
  background: var(--app-bg);
  border: 2px solid var(--line);
  overflow: hidden;
  direction: ltr;
}
.mode, .version, .ruler, .wave {
  position: relative;
  min-width: 0;
  min-height: 0;
}
.mode, .version {
  background: var(--surface);
  border-right: 2px solid var(--line);
}
.mode, .ruler, .version-a, .wave-a {
  border-bottom: 2px solid var(--line);
}
.mode {
  display: flex;
  align-items: center;
  padding-left: calc(var(--s) * 2.777778);
}
.mono {
  font-family: "JetBrains Mono", monospace;
  font-weight: 400;
  font-size: calc(var(--s) * 2.222222);
  line-height: 1;
  letter-spacing: 0;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.ruler {
  display: flex;
  align-items: center;
  overflow: hidden;
}
.bar-number {
  flex: 0 0 var(--bar-width);
  padding-left: calc(var(--s) * 2.407407);
}
.version {
  display: grid;
  place-items: center;
  font-size: calc(var(--s) * 8.888889);
  line-height: 1;
  font-weight: 700;
  letter-spacing: -.04em;
  overflow: hidden;
}
.version-letter { display: block; }
.selection {
  position: absolute;
  inset: calc(var(--s) * 2.222222) calc(var(--s) * 2.037037);
  border: 2px solid rgba(232,232,232,.5);
  background: rgba(232,232,232,.015);
  opacity: 0;
}
.wave {
  overflow: hidden;
  padding-left: calc(var(--s) * 2.592593);
}
.wave-content {
  display: flex;
  align-items: center;
  gap: calc(var(--s) * .648148);
  width: max-content;
  height: 100%;
}
.pill {
  position: relative;
  z-index: 1;
  display: block;
  flex: 0 0 calc(var(--s) * 1.574074);
  width: calc(var(--s) * 1.574074);
  height: calc(var(--peak) * 1%);
  max-height: calc(var(--s) * 13.888889);
  border-radius: 999px;
  background: var(--fg);
  opacity: .25;
}
.wave-b .pill {
  background: var(--compare-b);
  opacity: .45;
}
.grid-lines {
  position: absolute;
  inset: var(--ruler-height) 0 0 var(--label-width);
  display: flex;
  pointer-events: none;
}
.grid-bar {
  flex: 0 0 var(--bar-width);
  border-right: 2px solid var(--line);
}
.playhead {
  position: absolute;
  z-index: 3;
  top: calc(var(--s) * 5.370370);
  bottom: calc(var(--s) * 1.481481);
  left: calc(var(--s) * 37.037037);
  width: 2px;
  background: var(--fg);
  pointer-events: none;
}
.playhead::before {
  content: "";
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: calc(var(--s) * 1.481481);
  height: calc(var(--s) * 1.111111);
  background: var(--fg);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}
.footer {
  position: absolute;
  z-index: 4;
  display: flex;
  align-items: end;
  gap: calc(var(--s) * 2.777778);
  min-width: 0;
  pointer-events: none;
}
.position { white-space: nowrap; direction: ltr; }
.footer-rule {
  flex: 1;
  height: 1px;
  margin-bottom: calc(var(--s) * .925926);
  background: var(--line);
}
html[data-format="4x5"] .scene-layout {
  --copy-row: calc(var(--s) * 30);
}
html[data-format="4x5"] .scene-layout[data-id="s3"] {
  --copy-row: calc(var(--s) * 24.814815);
}
html[data-format="9x16"] .scene-layout {
  --copy-row: calc(var(--s) * 31.481481);
}
html[data-format="9x16"] .scene-layout[data-id="s3"] {
  --copy-row: calc(var(--s) * 24.814815);
}
html[data-format="4x5"] .scene-layout.without-brand,
html[data-format="9x16"] .scene-layout.without-brand,
html[data-format="4x5"] .scene-layout.empty-copy,
html[data-format="9x16"] .scene-layout.empty-copy {
  --copy-row: calc(var(--s) * 7.407407);
}
html[data-orientation="landscape"] {
  --headline-size: calc(var(--s) * 8.888889);
}
html[data-orientation="landscape"] .scene-layout {
  grid-template-columns: minmax(0, 44fr) minmax(0, 56fr);
  column-gap: calc(var(--s) * 5.925926);
  grid-template-rows:
    var(--header-height)
    minmax(0, 1fr)
    var(--cta-row)
    var(--footer-row);
}
html[data-orientation="landscape"] .copy-zone {
  grid-column: 1;
  grid-row: 2;
  padding-top: calc(var(--s) * 5.185185);
}
html[data-orientation="landscape"] .hero-slot {
  grid-column: 2;
  grid-row: 2 / 4;
  margin-top: calc(var(--s) * 5.185185);
}
html[data-orientation="landscape"] .cta-zone {
  grid-column: 1;
  grid-row: 3;
}
html[data-orientation="landscape"] .footer-slot {
  grid-column: 2;
  grid-row: 4;
}
html[data-orientation="landscape"] .scene-layout[data-id="s3"] .copy-zone {
  align-items: flex-start;
  padding-top: calc(var(--s) * 11.111111);
}
html[data-orientation="landscape"] .scene-layout[data-id="s3"] .hero-slot {
  margin-top: calc(var(--s) * 8.148148);
  margin-bottom: calc(var(--s) * 11.111111);
}
html[dir="rtl"] .cta-background { transform-origin: right center; }
html[dir="rtl"] .cta-arrow svg { transform: scaleX(-1); }
</style>
</head>
<body>
<main class="stage" id="stage">
  <header class="masthead">
    <img class="app-icon" id="app-icon" src="assets/sonicdesk/logos/app-icon.svg" alt="" decoding="sync">
  </header>

  <section class="compare" id="compare" aria-hidden="true">
    <div class="mode mono" id="mode"></div>
    <div class="ruler mono" id="ruler"></div>
    <div class="version version-a">
      <span class="version-letter" id="version-a"></span>
      <span class="selection" id="selection-a"></span>
    </div>
    <div class="wave wave-a"><div class="wave-content" id="wave-a"></div></div>
    <div class="version version-b">
      <span class="version-letter" id="version-b"></span>
      <span class="selection" id="selection-b"></span>
    </div>
    <div class="wave wave-b"><div class="wave-content" id="wave-b"></div></div>
    <div class="grid-lines" id="grid-lines"></div>
    <div class="playhead" id="playhead"></div>
  </section>

  <footer class="footer" id="footer" aria-hidden="true">
    <span class="mono position" id="position"></span>
    <span class="footer-rule"></span>
  </footer>
</main>

<script type="application/json" id="forma-motion">
{
  "recurring": "The supplied app icon remains fixed. One persistent HTML/CSS comparison surface, its waveform peaks, left label column and neutral control mark carry through every scene.",
  "s1": {
    "in": "The complete hook is readable at frame zero. A and B slide in opposite directions and settle onto the shared grid.",
    "hold": "Only supplied lines appear. When present, the two quoted replies reveal sequentially on one baseline. The waveforms make a restrained opposing push.",
    "out": "The waveforms lock back to their exact positions. Masked type exits while the comparison surface remains."
  },
  "s2": {
    "in": "Two masked proof lines reveal. A receives a neutral outline.",
    "hold": "The cursor traverses A, returns to the identical starting position, then traverses the same passage on B. Waveforms remain fixed and uncoloured. There is no winner state and no audio.",
    "out": "The cursor returns to the control point. The persistent comparison surface compresses into the final composition."
  },
  "s3": {
    "in": "The supplied wordmark reveals without scaling when brand is listed. The neutral CTA plate draws from inline start before its copy reveals.",
    "hold": "The comparison surface settles into the approved final geometry. All visible elements are completely still for at least the final second."
  },
  "reducedMotion": "Hard state changes at the supplied scene boundaries, without cursor or waveform travel.",
  "timing": "All scene timing is derived exclusively from FORMA.cut. The same document serves every duration, language and format."
}
</script>

<script>
(() => {
  "use strict";

  const F = window.FORMA;
  const stage = document.getElementById("stage");
  const hero = document.getElementById("compare");
  const footer = document.getElementById("footer");
  const cursor = document.getElementById("playhead");
  const position = document.getElementById("position");
  const waves = [
    document.getElementById("wave-a"),
    document.getElementById("wave-b")
  ];
  const letters = [
    document.getElementById("version-a"),
    document.getElementById("version-b")
  ];
  const selections = [
    document.getElementById("selection-a"),
    document.getElementById("selection-b")
  ];
  const copy = F.copy || {};
  const windows = F.cut.scenes;
  const length = Number(F.cut.length || F.length);
  const direction = F.dir === "rtl" ? -1 : 1;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const records = new Map();
  const model = { cursor: 0 };
  let timeline = null;
  let pendingTime = 0;
  let measuredBarWidth = 0;

  document.documentElement.lang = F.lang;
  document.documentElement.dir = F.dir || "ltr";
  document.title = String(copy.brand || copy.h1 || "");

  const demo = {
    versions: ["A", "B"],
    bars: [41, 42, 43, 44, 45],
    position: { bar: 42, beat: 1 },
    peaks: [
      [18,38,58,27,15,47,72,40,19,33,50,20,14,32,59,43,15,23,49,37,15,27,60,43,20,14,34,53,39,16,29,52,32,15,23,48,68,42,26,16,39,55],
      [18,38,58,27,15,47,72,40,19,43,65,52,34,18,50,62,38,23,49,37,15,27,60,43,20,14,34,53,39,16,29,52,32,15,23,48,68,42,26,16,39,55]
    ]
  };

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = String(text);
    return node;
  }

  document.getElementById("mode").textContent = demo.versions.join("/");
  demo.versions.forEach((version, index) => {
    letters[index].textContent = version;
    demo.peaks[index].forEach(peak => {
      const pill = element("i", "pill");
      pill.style.setProperty("--peak", peak);
      waves[index].appendChild(pill);
    });
  });
  demo.bars.forEach(bar => {
    document.getElementById("ruler").appendChild(element("span", "bar-number", bar));
    document.getElementById("grid-lines").appendChild(element("span", "grid-bar"));
  });

  function available(lines, key) {
    return lines.includes(key) &&
      Object.prototype.hasOwnProperty.call(copy, key) &&
      copy[key] != null &&
      String(copy[key]).trim().length > 0;
  }

  function makeHeadline(key, role, proof) {
    const heading = element("h1", "headline");
    heading.dataset.role = role;
    const text = String(copy[key]);
    const phrases = proof
      ? text.match(/[^.!?]+[.!?]+(?:[»”])?|[^.!?]+$/g) || [text]
      : [text];
    phrases.forEach(phrase => {
      const mask = element("span", "line-mask");
      mask.appendChild(element("span", "line-inner", phrase.trim()));
      heading.appendChild(mask);
    });
    return heading;
  }

  windows.forEach(win => {
    const lines = Array.isArray(win.lines) ? win.lines : [];
    const layout = element("section", "scene-layout");
    layout.dataset.id = win.id;

    const copyZone = element("div", "copy-zone");
    const heroSlot = element("div", "hero-slot");
    const ctaZone = element("div", "cta-zone");
    const footerSlot = element("div", "footer-slot");

    const record = {
      layout, copyZone, heroSlot, ctaZone, footerSlot,
      heading: null, subline: null, brand: null,
      cta: null, plate: null, arrow: null
    };

    if (win.id === "s1") {
      if (available(lines, "h1")) {
        record.heading = makeHeadline("h1", "hook", false);
        copyZone.appendChild(record.heading);
      }
      if (available(lines, "h1b")) {
        const subline = element("p", "subline");
        subline.dataset.role = "sub";
        const replies = String(copy.h1b).split(/\s+(?=[«“])/u);
        replies.forEach((reply, index) => {
          if (index) subline.appendChild(document.createTextNode(" "));
          const mask = element("span", "quote-mask");
          mask.appendChild(element("span", "quote-inner", reply));
          subline.appendChild(mask);
        });
        record.subline = subline;
        copyZone.appendChild(subline);
      }
    }

    if (win.id === "s2" && available(lines, "p1")) {
      record.heading = makeHeadline("p1", "proof", true);
      copyZone.appendChild(record.heading);
    }

    if (win.id === "s3") {
      if (available(lines, "brand")) {
        const mask = element("div", "brand-mask");
        const mark = element("div", "wordmark");
        mark.setAttribute("role", "img");
        mark.setAttribute("aria-label", String(copy.brand));
        mask.appendChild(mark);
        copyZone.appendChild(mask);
        record.brand = mark;
      } else {
        layout.classList.add("without-brand");
      }

      if (available(lines, "cta")) {
        const plate = element("div", "cta-plate");
        const background = element("div", "cta-background");
        const mask = element("div", "cta-text-mask");
        const text = element("p", "cta-copy", copy.cta);
        text.dataset.role = "cta";
        mask.appendChild(text);

        const arrow = element("span", "cta-arrow");
        arrow.setAttribute("aria-hidden", "true");
        arrow.innerHTML = '<svg viewBox="0 0 56 56" fill="none"><path d="M7 28H47M30 11L47 28L30 45" stroke="currentColor" stroke-width="3"/></svg>';

        plate.append(background, mask, arrow);
        ctaZone.appendChild(plate);
        record.cta = text;
        record.plate = background;
        record.arrow = arrow;
      } else {
        layout.classList.add("without-cta");
      }
    } else {
      ctaZone.hidden = true;
      if (!copyZone.children.length) layout.classList.add("empty-copy");
    }

    layout.append(copyZone, heroSlot, ctaZone, footerSlot);
    stage.appendChild(layout);
    records.set(win, record);
  });

  function drawState() {
    cursor.style.transform =
      `translate3d(${(model.cursor * measuredBarWidth).toFixed(3)}px,0,0)`;
    const beatOffset = Math.max(0, Math.floor(model.cursor * 4 + 0.00001));
    const bar = demo.position.bar + Math.floor(beatOffset / 4);
    const beat = demo.position.beat + beatOffset % 4;
    position.textContent = [bar, beat].join(".");
  }

  window.renderFrame = function(t) {
    const value = Number(t);
    pendingTime = Math.max(0, Math.min(length, Number.isFinite(value) ? value : 0));
    if (!timeline) return;
    timeline.time(pendingTime, true);
    drawState();
  };

  F.setup(async () => {
    const allCampaignText = Array.from(stage.querySelectorAll("[data-role]"));
    const fontLoads = [
      document.fonts.load('800 16px "Archivo"'),
      document.fonts.load('700 16px "Archivo"'),
      document.fonts.load('400 16px "JetBrains Mono"')
    ];
    const markAsset = new Image();
    markAsset.src = "assets/sonicdesk/logos/wordmark.svg";
    const icon = document.getElementById("app-icon");
    await Promise.allSettled([
      ...fontLoads,
      icon.decode(),
      markAsset.decode()
    ]);
    await document.fonts.ready;

    allCampaignText.forEach(node => {
      const text = node.textContent;
      const weight = node.classList.contains("headline") ? 800 : 700;
      const loaded = document.fonts.check(`${weight} 16px "Archivo"`, text);
      // Supplied Archivo subsets contain Latin, not Cyrillic.
      const suppliedCoverage = !/[\u0400-\u052F]/u.test(text);
      node.style.fontFamily = loaded && suppliedCoverage
        ? "Archivo, Arial, sans-serif"
        : "Arial, Helvetica, sans-serif";
    });

    const short = Math.min(stage.clientWidth, stage.clientHeight);
    const unit = short / 1080;
    const landscape = F.orientation === "landscape";
    // Fixed role sizes make the hierarchy identical between RU and EN.
    // Both translations fit these deliberately reserved geometries.
    const roleSizes = {
      hook: (landscape ? 96 : 112) * unit,
      proof: (landscape ? 96 : 112) * unit,
      sub: 44 * unit,
      cta: 64 * unit
    };

    for (const [role, size] of Object.entries(roleSizes)) {
      const nodes = Array.from(stage.querySelectorAll(`[data-role="${role}"]`));
      for (const node of nodes) {
        await F.fit(node, { max: size, min: size });
      }
      if (nodes.length) {
        await F.fitGroup(nodes, { max: size, min: size });
      }
    }

    const stageRect = stage.getBoundingClientRect();
    function rect(node) {
      const box = node.getBoundingClientRect();
      return {
        left: Math.round(box.left - stageRect.left),
        top: Math.round(box.top - stageRect.top),
        width: Math.round(box.width),
        height: Math.round(box.height)
      };
    }

    for (const win of windows) {
      const record = records.get(win);
      record.heroRect = rect(record.heroSlot);
      record.footerRect = rect(record.footerSlot);
    }

    const firstRecord = records.get(windows[0]);
    gsap.set(hero, firstRecord.heroRect);
    gsap.set(footer, firstRecord.footerRect);
    gsap.set(selections, { opacity: 0 });
    gsap.set([...waves, ...letters], { x: 0 });
    for (const record of records.values()) {
      gsap.set(record.layout, { autoAlpha: 0 });
    }

    measuredBarWidth = document.querySelector(".bar-number").getBoundingClientRect().width;
    const rowTravel = Math.min(
      40 * unit,
      hero.querySelector(".wave").getBoundingClientRect().width * .05
    );
    const holdTravel = Math.min(12 * unit, rowTravel * .3);
    const finalSettle = Math.min(10 * unit, firstRecord.heroRect.height * .025);

    const tl = gsap.timeline({ paused: true });
    const clock = { value: 0 };
    tl.to(clock, { value: 1, duration: length, ease: "none" }, 0);

    function timing(win) {
      const duration = win.end - win.start;
      const ratio = Math.min(1, duration / 1.6);
      const entrance = Math.max(.25, .6 * ratio);
      const transition = Math.max(.25, .5 * ratio);
      return {
        duration,
        entrance: Math.min(entrance, duration),
        transition,
        lead: Math.min(.25, transition / 2, duration * .2)
      };
    }

    function enter(timeline, win, options = {}) {
      const record = records.get(win);
      const timingValues = timing(win);
      const first = win === windows[0];

      timeline.set(record.layout, { autoAlpha: 1 }, win.start);

      const destination = {
        ...record.heroRect,
        height: record.heroRect.height + (options.settle || 0)
      };

      if (reduced || first) {
        timeline.set(hero, record.heroRect, win.start);
        timeline.set(footer, record.footerRect, win.start);
      } else {
        timeline.to(hero, {
          ...destination,
          duration: timingValues.entrance,
          ease: "power2.inOut"
        }, win.start);
        timeline.to(footer, {
          ...record.footerRect,
          duration: timingValues.entrance,
          ease: "power2.inOut"
        }, win.start);
      }

      const lines = record.heading
        ? Array.from(record.heading.querySelectorAll(".line-inner"))
        : [];
      if (lines.length && !reduced && !first) {
        const stagger = Math.min(.06, timingValues.entrance * .1);
        timeline.fromTo(lines, { yPercent: 110 }, {
          yPercent: 0,
          duration: Math.max(.25, timingValues.entrance - stagger * (lines.length - 1)),
          stagger,
          ease: "power4.out",
          immediateRender: false
        }, win.start);
      }

      if (win !== windows[windows.length - 1]) {
        const outgoing = Array.from(record.layout.querySelectorAll(
          ".line-inner, .quote-inner, .wordmark, .cta-copy"
        ));
        if (!reduced && outgoing.length) {
          timeline.to(outgoing, {
            yPercent: -115,
            duration: timingValues.lead,
            ease: "power2.in"
          }, win.end - timingValues.lead);
        }
        timeline.set(record.layout, { autoAlpha: 0 }, win.end);
      }

      return { record, first, ...timingValues };
    }

    const SCENES = {
      s1: (timeline, win, lines) => {
        const { record, duration, entrance, lead } = enter(timeline, win);
        timeline.set(model, { cursor: 0 }, win.start);
        timeline.set(selections, { opacity: 0 }, win.start);

        if (reduced) return;

        waves.forEach((wave, index) => {
          const sign = (index ? -1 : 1) * direction;
          timeline.fromTo([wave, letters[index]], {
            x: sign * rowTravel
          }, {
            x: 0,
            duration: entrance,
            ease: "power4.out",
            immediateRender: false
          }, win.start);

          const driftStart = win.start + entrance;
          const driftEnd = win.end - lead;
          if (driftEnd > driftStart) {
            timeline.to(wave, {
              x: -sign * holdTravel,
              duration: driftEnd - driftStart,
              ease: "none"
            }, driftStart);
            timeline.to(wave, {
              x: 0,
              duration: lead,
              ease: "power2.inOut"
            }, driftEnd);
          }
        });

        if (available(lines, "h1b") && record.subline) {
          const replies = Array.from(record.subline.querySelectorAll(".quote-inner"));
          const revealDuration = Math.min(.5, entrance);
          const firstReply = win.start + entrance * .75;
          const lastPossible = win.end - lead - revealDuration;
          const spacing = replies.length > 1
            ? Math.max(0, Math.min(duration * .18, (lastPossible - firstReply) / (replies.length - 1)))
            : 0;

          replies.forEach((reply, index) => {
            timeline.fromTo(reply, { yPercent: 110 }, {
              yPercent: 0,
              duration: revealDuration,
              ease: "power4.out",
              immediateRender: false
            }, Math.max(win.start, Math.min(lastPossible, firstReply + index * spacing)));
          });
        }
      },

      s2: (timeline, win, lines) => {
        const { entrance, lead } = enter(timeline, win);
        timeline.set([...waves, ...letters], { x: 0 }, win.start);
        timeline.set(model, { cursor: 0 }, win.start);
        timeline.set(selections[0], { opacity: 1 }, win.start);
        timeline.set(selections[1], { opacity: 0 }, win.start);

        if (reduced) return;

        const start = win.start + entrance;
        const end = win.end - lead;
        const span = Math.max(0, end - start);
        if (!span) return;

        const distance = .95;
        timeline.to(model, {
          cursor: distance,
          duration: span * .40,
          ease: "none"
        }, start);

        timeline.to(model, {
          cursor: 0,
          duration: span * .10,
          ease: "power2.inOut"
        }, start + span * .40);

        timeline.set(selections[0], { opacity: 0 }, start + span * .50);
        timeline.set(selections[1], { opacity: 1 }, start + span * .50);

        timeline.to(model, {
          cursor: distance,
          duration: span * .40,
          ease: "none"
        }, start + span * .50);

        timeline.to(model, {
          cursor: 0,
          duration: span * .10,
          ease: "power2.inOut"
        }, start + span * .90);
      },

      s3: (timeline, win, lines) => {
        const { record, entrance, first } = enter(timeline, win, {
          settle: reduced ? 0 : finalSettle
        });
        timeline.set(model, { cursor: 0 }, win.start);
        timeline.set([...waves, ...letters], { x: 0 }, win.start);

        if (reduced) {
          timeline.set(selections, { opacity: 0 }, win.start);
          timeline.set(letters, { fontSize: 80 * unit }, win.start);
          return;
        }

        timeline.to(selections, {
          opacity: 0,
          duration: Math.min(.25, entrance),
          ease: "power2.out"
        }, win.start);

        timeline.to(letters, {
          fontSize: 80 * unit,
          duration: entrance,
          ease: "power2.inOut"
        }, win.start);

        if (record.brand && available(lines, "brand") && !first) {
          timeline.fromTo(record.brand, { yPercent: 112 }, {
            yPercent: 0,
            duration: entrance,
            ease: "power4.out",
            immediateRender: false
          }, win.start);
        }

        if (record.cta && available(lines, "cta") && !first) {
          const plateDuration = Math.min(.45, entrance * .75);
          const copyDelay = entrance * .25;
          timeline.fromTo(record.plate, { scaleX: 0 }, {
            scaleX: 1,
            duration: plateDuration,
            ease: "power3.out",
            immediateRender: false
          }, win.start);

          timeline.fromTo(record.cta, { yPercent: 120 }, {
            yPercent: 0,
            duration: entrance - copyDelay,
            ease: "power4.out",
            immediateRender: false
          }, win.start + copyDelay);

          timeline.fromTo(record.arrow, {
            clipPath: direction === 1
              ? "inset(0 100% 0 0)"
              : "inset(0 0 0 100%)"
          }, {
            clipPath: "inset(0 0% 0 0%)",
            duration: entrance - copyDelay,
            ease: "power3.out",
            immediateRender: false
          }, win.start + copyDelay);
        }

        const settlingStart = win.start + entrance;
        const stillStart = Math.max(settlingStart, win.end - 1);
        if (!first && stillStart > settlingStart) {
          timeline.to(hero, {
            height: record.heroRect.height,
            duration: stillStart - settlingStart,
            ease: "sine.out"
          }, settlingStart);
        } else {
          timeline.set(hero, record.heroRect, settlingStart);
        }
      }
    };

    for (const win of windows) {
      const builder = SCENES[win.id];
      if (builder) builder(tl, win, win.lines || []);
    }

    timeline = tl;
    // Prime both endpoints once so subsequent arbitrary seeks restore every
    // transform, visibility state and numeric model value deterministically.
    timeline.time(length, true);
    window.renderFrame(pendingTime);
  });
})();
</script>
</body>
</html>
