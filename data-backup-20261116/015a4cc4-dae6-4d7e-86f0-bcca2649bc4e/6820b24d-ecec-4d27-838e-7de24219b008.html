const input={"scenario":"Theme: You already count every small spend, so KITE pays some of it back: 5% on groceries, transport and coffee, cent by cent.\nScenes: 4 · 8 s\n\n1. HOOK (0.0–2.4 s): \"€1.80 for milk.\" then \"+9¢ back.\" Someone buys an ordinary carton of milk, and a little money comes straight back before they've left the checkout.\n\n2. PROOF (2.4–4.6 s): \"Tram €3.20 · +16¢\" then \"Flat white €3.60 · +18¢\". The day goes on with the ride home and the morning coffee, and each small spend pays back as it happens.\n\n3. TALLY (4.6–5.6 s): \"Today: 43¢ back.\" The three everyday spends add up to one real number the person didn't have to chase.\n\n4. OFFER + CTA (5.6–8 s): \"Free card. 3 minutes / no fee · no minimum\" · CTA \"GET THE CARD\". Fully resolved by 6.8 s, then holds with the brand and CTA readable until 8 s.","style":"Pocket Collage\n\nPhotographed cut-out objects from the day (a milk carton, a tram ticket, a flat white seen from above) slap onto the flat orange field one after another, while a flat cream tote pocket at the bottom slowly releases the real KITE card a little more with every cent.\n\nMEDIUM: a top-down photo collage. Real studio photographs of everyday props are shot overhead in soft, even window light (5600K warmed to the LUT) and cut out with hard edges. They sit directly on the flat #FF5A1F field with no drop shadows, no outlines and no paper texture, as the guide requires. Props carry no brands and no readable print: the milk carton is plain white with a muted grey-blue band, the tram ticket is off-white with abstract printed bars, and the flat white is in a white ceramic cup on a saucer with a rosetta in the crema. HERO: one oversized prop per beat, cropped boldly so it bleeds off an edge (the cup fills the right half in PROOF). ACCENT DEVICE: the brand tab reinterpreted as its own metaphor. A flat cream tote with a stitched pocket mouth (a 5 px orange rule) sits at the lower left, and the KITE card pokes out of it. The card follows the reference exactly: a vertical matte orange card with rounded corners, a light-gold chip centred in the upper third, the contactless icon to the right and the cream KITE mark at the bottom (hidden in the pocket until the end). The cream tote gives the orange card the contrast it needs against the field. RECURRING ELEMENT: the card in the pocket. It rises about 20 px with each cent earned, so by TALLY the chip is fully clear. COMPOSITION (1:1): the corner wordmark sits at 108/68. Copy plaques run along the top-left margin (cream plaques, orange text, Schibsted Grotesk 800 at 62–83 px, radius 0). Props occupy the right and centre, and the pocket is anchored bottom-left. In 9:16 the pocket sits above the bottom safe zone; in 16:9 the props line up left to right like the day's timeline. MOTION MECHANISM: stop-motion placement. Each prop drops onto the field with one back.out(1.6) settle, or 'drop' on the brand in curve (0.25 s). It is rotated at most ±4° and held on 12-fps stepped frames for a handmade cadence, while the type stays at 24 fps with the brand curves. The previous prop is shoved off the nearest edge (a move, 0.16 s, out curve), so it reads as a table being cleared, not a slide swap. Constant life comes from a 10 px drift of the hero prop along one axis; no scaling. HOOK 0.00–2.40: frame 0 shows the milk carton large and bleeding off the right edge, the pocket with the card's top edge just showing, and '€1.80 for milk.' on its plaque. At 1.10 the '+9¢ back.' plaque draws in from the left (0.20 s), the text types on by word and the card nudges up 20 px. PROOF 2.40–4.60: the carton is shoved up and out the top-right (it still peeks in the keyframe). The tram ticket drops in tilted −4° at 2.50, and 'Tram €3.20 · +16¢' draws in at 2.65 as the card rises again. At 3.45 the flat white lands as the beat's single weighted settle, overlapping the ticket. 'Flat white €3.60 · +18¢' draws in below at 3.55 and the card rises a third time, showing the full chi
