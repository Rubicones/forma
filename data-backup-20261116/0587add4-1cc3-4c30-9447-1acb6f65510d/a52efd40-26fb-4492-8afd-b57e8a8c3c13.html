    placeImg(sibP.querySelector('img'),kp,CROP.x,CROP.y);
    var rBase=baseW*sib[1].wr,rCW=CROP.h*9/16,kr=rBase/rCW;
    sibRl.style.width=rBase+'px';sibRl.style.height=(CROP.h*kr)+'px';sibRl.style.borderRadius=(14*u*baseW/cO.w)+'px';
    placeImg(sibRl.querySelector('img'),kr,CROP.x+(CROP.w-rCW)/2,CROP.y);
    G.sibs=[{el:sibP,base:pBase},{el:sibRl,base:rBase}];

    G.demoW=G.demo.offsetWidth;G.demoH=G.demo.offsetHeight;
    var bd=104*u,bi=$('#badge .bi');bi.style.width=bd+'px';bi.style.height=bd+'px';bi.style.left=(-bd/2)+'px';bi.style.top=(-bd/2)+'px';

    // ---- initial state (frame 0 = finished thumbnail)
    P.x=cH.x;P.y=cH.y;P.w=cH.w;P.s=1;P.dxp=0;P.dyp=0;P.dxo=0;
    T.x=tileR.x;T.y=tileR.y;T.w=tileR.w;T.h=tileR.h;T.r=32*u;
    SK.r=100;S.p1=0;S.p2=0;R.a=0;

    var cr=chipEls.map(function(c){return{x:c.offsetLeft,y:c.offsetTop,w:c.offsetWidth};});
    var pill=$('#pill'),pillWrap=$('#pillWrap');
    gsap.set(pill,{x:cr[0].x,y:cr[0].y,width:cr[0].w});
    gsap.set(chipEls[0],{color:NAVY});

    tl=gsap.timeline({paused:true});
    function reveal(sp,t,o){o=o||{};var st=o.st==null?.06:o.st;
      tl.fromTo(sp,{yPercent:105},{yPercent:0,duration:o.d||.6,ease:o.ease||'expo.out',stagger:st},t);
      tl.fromTo(sp,{filter:'blur(8px)'},{filter:'blur(0px)',duration:.2,ease:'power2.out',stagger:st},t+.04);}
    function drawIn(el,t,d,r){tl.fromTo(el,{clipPath:'inset(0% 100% 0% 0% round '+r+'px)'},{clipPath:'inset(0% 0% 0% 0% round '+r+'px)',duration:d,ease:'power3.out'},t);}

    // ===== HOOK 0.00–2.40
    tl.to(P,{s:1.03,duration:2.25,ease:'sine.inOut'},0);                 // card drift 1→1.03
    drawIn(pbg,0.70,0.45,32*u);                                            // 0.70 sky plate draws in
    reveal(sLB.concat(sB),0.85,{st:.06});                                  // 0.85 voice B, line by line
    // transition 2.20–2.85
    tl.to(sLA.concat(sA,sLB,sB),{yPercent:-105,duration:.3,ease:'power2.in',stagger:.02},2.20);
    tl.to(pbg,{clipPath:'inset(0% 0% 100% 0% round '+(32*u)+'px)',duration:.3,ease:'power2.in'},2.22);
    tl.to(T,{x:0,y:0,w:W,h:H,r:0,duration:.6,ease:'expo.inOut'},2.25);    // navy tile expands from the hero
    tl.to(P,{x:cP.x,y:cP.y,w:cP.w,s:1,duration:.6,ease:'expo.inOut'},2.25); // card rides into PROOF crop

    // ===== PROOF 2.40–5.00
    reveal(sP,2.70,{st:.07});                                              // 2.70 "New hook. / Same look."
    tl.fromTo([$('#labH')].concat(chipEls),{y:32*u,autoAlpha:0},{y:0,autoAlpha:1,duration:.6,ease:'power4.out',stagger:.05},2.80);
    tl.fromTo(pillWrap,{y:32*u,autoAlpha:0},{y:0,autoAlpha:1,duration:.6,ease:'power4.out'},2.85);
    tl.fromTo(P,{dxp:0,dyp:0},{dxp:-12*u,dyp:-12*u,duration:1.9,ease:'sine.inOut'},2.85);
    var roll0=roll;
    [3.00,3.45,3.90,4.35].forEach(function(t,i){                          // selection pill steps chip to chip
      tl.to(pill,{x:cr[i+1].x,y:cr[i+1].y,width:cr[i+1].w,duration:.32,ease:'power2.inOut'},t);
      tl.to(chipEls[i],{color:'#ffffff',duration:.32,ease:'power2.inOut'},t);
      tl.to(chipEls[i+1],{color:NAVY,duration:.32,ease:'power2.inOut'},t);
      tl.fromTo(roll0,{y:0},{y:-bandH,duration:.3,ease:'expo.out',immediateRender:false},t+.2); // masked headline-band swap
    });
    tl.fromTo(bi,{scale:.7,autoAlpha:0},{scale:1,autoAlpha:1,duration:.3,ease:'expo.out'},4.45); // 4.45 orange check
    drawIn($('#exp .tbg'),4.45,.4,8*u);
    reveal(sExp,4.62,{d:.5});

    // transition 4.75–5.35
    tl.to(SK,{r:0,duration:.6,ease:WIPE},4.75);                            // sky panel wipes L→R
    tl.to(P,{x:cO.x,y:cO.y,w:cO.w,dxp:0,dyp:0,duration:.6,ease:'expo.inOut'},4.75);
    tl.to(R,{a:1,duration:.3,ease:'power2.out'},4.90);
    tl.to(S,{p1:1,duration:.6,ease:'expo.out'},4.95);                      // siblings slide out from behind
    tl.to(S,{p2:1,duration:.6,ease:'expo.out'},5.01);

    // ===== OFFER + CTA 5.00–8.00
    reveal(sO,5.25,{st:.07});                                              // 5.25 headline
    drawIn($('#offTag .tbg'),5.70,.4,8*u);reveal(sOff,5.85,{d:.5});        // 5.70 offer tag
    drawIn($('#cta .cbg'),6.00,.45,42*u);reveal(sCta,6.15,{d:.5});         // 6.00 CTA pill, 6.15 text
    reveal(sUrl,6.30,{d:.5});                                              // 6.30 url → resolved 6.80
    tl.fromTo(P,{dxo:0},{dxo:-12*u,duration:2.65,ease:'none'},5.35);       // card group drifts 12px left
    tl.set({}, {}, 8);

    tl.time(0);apply();
  });

  window.renderFrame=function(t){
    if(!tl)return;
    tl.time(Math.max(0,Math.min(8,t)),false);
    apply();
  };
})();
</script>
<script>(function controller() {
  const F = window.FORMA, D = F.duration, params = new URLSearchParams(location.search);
  let t = Math.max(0, Math.min(D, Number(params.get('t')) || 0)), playing = !params.has('paused'), last = null, started = false;
  const send = () => { try { parent.postMessage({type:'forma:time', t, duration:D, playing, timeline:typeof window.renderFrame === 'function', format:F.format}, '*'); } catch {} };
  const draw = () => { try { window.renderFrame?.(t); } catch (e) { console.error(e); } send(); };
  function tick(now) {
    if (!playing) return;
    if (last !== null) t = Math.min(D, t + (now - last) / 1000);
    last = now;
    draw();
    if (t >= D) { playing = F.playing = false; send(); return; }
    requestAnimationFrame(tick);
  }
  function play() { if (!started) return; if (t >= D) t = 0; playing = F.playing = true; last = null; requestAnimationFrame(tick); }
  function pause() { playing = F.playing = false; draw(); }
  addEventListener('message', e => {
    if (e.source !== parent || !e.data) return;
    const m = e.data;
    if (m.type === 'forma:play') play();
    if (m.type === 'forma:pause') pause();
    if (m.type === 'forma:seek') { t = Math.max(0, Math.min(D, Number(m.t) || 0)); if (!playing) draw(); }
    if (m.type === 'forma:hello') send();
  });
  const loaded = document.readyState === 'complete' ? Promise.resolve() : new Promise(r => addEventListener('load', r, {once:true}));
  Promise.all([loaded, document.fonts.ready])
    .then(async () => { for (const fn of F._setups) await fn(); })
    .catch(e => console.error(e))
    .then(() => { started = true; F.playing = playing; draw(); if (playing) play(); });
})()</script></body>
